    onResize() { if (V.batter) homeCamera(false); },
    onKey(k) { if (k === " ") swing(); },
    renderMenu() {

      o.appendChild(seg("Pitcher", "diffSeg", [[0, "Easy"], [1, "Medium"], [2, "Hard"]], s.diff, v => { s.diff = v; this.persist(); this.renderMenu(); }));
      const best = s.best[s.game][s.diff];
      $("record").textContent = (best ? (s.game === "derby" ? `Best on ${LV[s.diff].name}: ${best} home runs` : `Best on ${LV[s.diff].name}: ${best} runs`) : "") + (s.longest ? `${best ? " · " : ""}Longest homer: ${s.longest} m` : "");

      $("help").innerHTML = `<p><b>Aim</b> your swing: move the mouse (or your finger) to where the ball will cross the plate. The white box is the strike zone.</p>
        <p><b>Swing:</b> click, tap or press <b>Space</b> just as the ball arrives. Early = pull it to left field, late = right field. Under the ball = fly ball, over it = grounder.</p>
        <p>Watch out for curveballs (they drop) and sliders (they slide). On Easy, a yellow ring shows where each pitch is going. <b>P</b> pause · <b>F</b> full screen</p>`;
    },
    reset() { Object.assign(ball, { x: 0, y: 1.8, z: MOUND, vx: 0, vy: 0, vz: 0, mode: "held" }); hitPlay = null; runnerAnims.length = 0; },
    start() {

    update(dt) {

        } else stepBall(ball, dt);
        if (t >= hitPlay.end) finishPlay();
      }
      const derby = this.save.game === "derby";
      board(derby ? [{ label: "HR", value: hrs, color: "#ff5a4e" }, { label: "OUTS", value: `${outs}/10` }, { label: "LONGEST", value: longest ? longest + " m" : "–" }]
        : [{ label: "INNING", value: `${inning}/3` }, { label: "RUNS", value: runs, color: "#ff5a4e" }, { label: "OUTS", value: outs }, { label: "COUNT", value: `${balls}-${strikes}` }]);
    },
    finish() {
      const s = this.save, derby = s.game === "derby", val = derby ? hrs : runs, prev = s.best[s.game][s.diff];
      if (val > prev) s.best[s.game][s.diff] = val;
      if (longest > s.longest) s.longest = longest;
      this.persist();
      gameOver(derby ? `${hrs} HOME RUN${hrs === 1 ? "" : "S"}!` : `${runs} RUN${runs === 1 ? "" : "S"}!`,
        derby ? [`${hrs} homers`, `Longest ${longest || 0} m`, `${hits} hits`] : [`${runs} runs`, `${hits} hits`, `${hrs} homers`],
        val > prev ? "New best!" : `Best on ${LV[s.diff].name}: ${s.best[s.game][s.diff]}`, val > prev && val > 0);
    },
    render(dt, st) {
      if (!V.batter) return;
      const { T3 } = G;
      // pitcher windup and throw
      const pt = V.pitcherT, pa = V.pitcher.arm;
      if (pt < 0.7) { pa.rotation.y = lerp(0.6, -1.6, pt / 0.7); V.pitcher.upper.rotation.y = lerp(0, -0.5, pt / 0.7); }
      else if (pt < 1.0) { const k = (pt - 0.7) / 0.3; pa.rotation.y = lerp(-1.6, 2.2, k); V.pitcher.upper.rotation.y = lerp(-0.5, 0.4, k); }
      else { pa.rotation.y += (0.6 - pa.rotation.y) * Math.min(1, dt * 4); V.pitcher.upper.rotation.y *= 0.95; }

      // batter: ready stance, then swing through the zone

      if (swung && sw >= 0 && sw < 0.35) { const k = Math.min(1, sw / 0.24); bt.arm.rotation.y = lerp(-1.9, 2.4, 1 - Math.pow(1 - k, 2)); bt.upper.rotation.y = lerp(-0.6, 1.1, k); }
      else { bt.arm.rotation.y += (-1.9 - bt.arm.rotation.y) * Math.min(1, dt * 6); bt.upper.rotation.y += (-0.6 - bt.upper.rotation.y) * Math.min(1, dt * 6); }

      const play = hitPlay, el = play && play.start ? t - play.start : 0;
      V.fielders.forEach((f, i) => {
        if (i === 0) return;
        let [hx, hz] = FIELD[i];
        if (play && play.fielder === i && play.catchAt) { const c = play.catchAt, k = clamp((el - 0.3) / Math.max(0.3, c[3] - 0.3), 0, 1); hx = lerp(FIELD[i][0], c[0], k); hz = lerp(FIELD[i][1], c[2], k); }
        const moved = Math.hypot(hx - f.g.position.x, hz - f.g.position.z);
        if (moved > 0.01) f.g.rotation.y = Math.atan2(-(hx - f.g.position.x), -(hz - f.g.position.z));
        else f.g.rotation.y += (Math.atan2(f.g.position.x, f.g.position.z) - f.g.rotation.y) * 0.1;
        f.g.position.x = hx; f.g.position.z = hz; f.g.position.y = G.runLegs(f, moved / Math.max(dt, 1e-3), dt);
      });
      // runners on base (and running)
      const basePos = i => BASES[i % 4];
      const occ = [...bases]; let ri = 0;
      for (const r of V.runners) r.g.visible = false;
      for (let i = runnerAnims.length - 1; i >= 0; i--) if (t - runnerAnims[i].t0 > 1.0 + (runnerAnims[i].to - runnerAnims[i].from) * 1.0) runnerAnims.splice(i, 1);
      for (const a of runnerAnims) { if (ri >= 4) break; const r = V.runners[ri++], total = a.to - a.from, k = clamp((t - a.t0) / (total * 1.0), 0, 1), seg2 = Math.min(total - 1e-6, k * total), b0 = a.from + Math.floor(seg2), f2 = seg2 - Math.floor(seg2);
        const p0 = basePos(b0), p1 = basePos(b0 + 1); r.g.visible = true; r.g.position.set(lerp(p0[0], p1[0], f2), G.runLegs(r, 7, dt), lerp(p0[1], p1[1], f2)); r.g.rotation.y = Math.atan2(-(p1[0] - p0[0]), -(p1[1] - p0[1])); if (a.to >= 4 && k >= 1) r.g.visible = false; }
      for (let b = 0; b < 3; b++) if (occ[b] && !runnerAnims.some(a => a.to === b + 1)) { if (ri >= 4) break; const r = V.runners[ri++], p = BASES[b + 1]; r.g.visible = true; r.g.position.set(p[0] + 0.6, 0, p[1]); r.g.rotation.y = Math.PI; }
      // ball, shadow, trail
      const hidden = ball.mode === "held" && V.pitcherT > 0.7;
      V.ballM.visible = !hidden;
      if (ball.mode === "held") { const h = V.pitcher.hand.getWorldPosition(V.tmp); V.ballM.position.copy(h); } else V.ballM.position.set(ball.x, ball.y, ball.z);
      V.shadow.position.set(V.ballM.position.x, 0.02, V.ballM.position.z); V.shadow.material.opacity = Math.max(0.08, 0.35 - V.ballM.position.y * 0.01);
      if (ball.mode === "hit" || ball.mode === "pitch") { V.trailPts.push(V.ballM.position.clone()); if (V.trailPts.length > 12) V.trailPts.shift(); } else V.trailPts.length = 0;
      V.trail.forEach((m, i) => { const p = V.trailPts[i]; m.visible = !!p && i < V.trailPts.length - 1; if (m.visible) { m.position.copy(p); m.material.opacity = (i / V.trailPts.length) * 0.35; } });
      // swing spot and the Easy helper ring
      const showAim = st === "play" || st === "pause";
      V.spot.visible = V.zg.visible = showAim && ball.mode !== "hit";
      V.spot.position.set(aim.x, aim.y, 0.02);
      V.helper.visible = showAim && LV[this.save.diff].help && ball.mode === "pitch" && !!pitchTarget;
      if (V.helper.visible) V.helper.position.set(pitchTarget.x, pitchTarget.y, 0.03);
      // camera: behind the plate, then follow the ball after a hit
      if (ball.mode === "hit" && hitPlay && hitPlay.path) {
        const b = V.ballM.position, dir = V.tmp.set(b.x, 0, b.z); const L = dir.length() || 1;
        const want = new T3.Vector3(b.x * 0.55, Math.max(4, b.y * 0.6 + 4), b.z * 0.55 + 12);
        if (L < 6) want.copy(V.homePos);
        V.camPos.lerp(want, Math.min(1, dt * 2.2)); V.camLook.lerp(b, Math.min(1, dt * 5));
      } else { V.camPos.lerp(V.homePos, Math.min(1, dt * 3)); V.camLook.lerp(V.homeLook, Math.min(1, dt * 3)); }
      G.camera.position.copy(V.camPos); G.camera.lookAt(V.camLook);
    },
  });
  if (DEBUG) window.__bb = { ball, aim, swing, throwPitch, resolveHit, stepBall, fenceDist, get pitch() { return pitch; }, get hitPlay() { return hitPlay; }, get t() { return t; }, get outs() { return outs; }, get hrs() { return hrs; }, get runs() { return runs; }, get counts() { return { balls, strikes, outs, inning, bases: [...bases] }; } };

  // ---------- flow buttons ----------
  $("playBtn").addEventListener("click", startGame);
  $("againBtn").addEventListener("click", startGame);
  $("resumeBtn").addEventListener("click", resume);
  $("restartBtn").addEventListener("click", () => { state = "play"; GAME.start(); show(null); canvas.focus(); });
  $("quitBtn").addEventListener("click", quit);
  $("menuBtn2").addEventListener("click", quit);
  $("pauseBtn").addEventListener("click", pauseGame);
  $("fsBtn").addEventListener("click", toggleFull); $("fsMenuBtn").addEventListener("click", toggleFull);
  $("helpBtn").addEventListener("click", () => $("help").classList.toggle("hidden"));
  $("soundBtn").addEventListener("click", () => { soundOn = !soundOn; GAME.save.sound = soundOn; GAME.persist(); $("soundBtn").textContent = "Sound: " + (soundOn ? "on" : "off"); });
  addEventListener("resize", () => { if (G) G.resize(); if (GAME.onResize) GAME.onResize(); });
  for (const ev of ["fullscreenchange", "webkitfullscreenchange"]) document.addEventListener(ev, () => { if (G) G.resize(); if (GAME.onResize) GAME.onResize(); });
  document.addEventListener("visibilitychange", () => { if (document.hidden && state === "play") pauseGame(); });
  // ---------- boot + loop ----------
  (async () => {
    const d = await store.get(GAME.saveKey);
    if (d && typeof d === "object") GAME.load(d);
    soundOn = GAME.save.sound !== false;
    $("soundBtn").textContent = "Sound: " + (soundOn ? "on" : "off");
    GAME.renderMenu();
  })();
  if (G) GAME.init();
  GAME.renderMenu();
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
    if (G) {
      if (state === "play") GAME.update(dt);
      GAME.render(dt, state);
      G.renderer.render(G.scene, G.camera);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  if (DEBUG) window.__g = { GAME: () => GAME, state: () => state, keys };
})();
