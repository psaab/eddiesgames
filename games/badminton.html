    let sx = (rt ? 1 : 0) - (lf ? 1 : 0), sy = (up ? 1 : 0) - (dn ? 1 : 0);
    if (!sx && !sy) return false;
    // behind-the-player camera: up = toward the net; sideline camera: up = away from the camera
    let mx, mz;
    if (V.view === "side") { mx = -sy; mz = -sx; } else { mx = sx; mz = -sy; }
    if (who === 1 && V.view !== "side") { mx = -mx; mz = -mz; }
    const l = Math.hypot(mx, mz); pl[who].tx = pl[who].x + mx / l * 1.2; pl[who].tz = pl[who].z + mz / l * 1.2;
    if (GAME.save.mode === 1 && !mouseAims) mouseAims = true;
    return true;
  }
  const lift = e => ptrs.delete(e.pointerId); canvas.addEventListener("pointerup", lift); canvas.addEventListener("pointercancel", lift);

  // ---------- pose the 3D players ----------
  function pose(i, dt) {
    const p = pl[i], m = V.P[i];
    const base = i === 0 ? 0 : Math.PI;
    let want = Math.atan2(-(sh.x - p.x), -(sh.z - p.z)) - base; want = Math.atan2(Math.sin(want), Math.cos(want));
    m.g.rotation.y = base + clamp(want, -1, 1) * 0.45;
    const bob = G.runLegs(m, Math.hypot(p.vx, p.vz), dt);
    p.jumpT += dt; const jy = p.jumpT < 0.5 ? Math.sin(p.jumpT / 0.5 * Math.PI) * 0.45 : 0;
    m.g.position.set(p.x, bob + jy, p.z);
    const right = (sh.x - p.x) * (i === 0 ? 1 : -1) >= 0 ? 1 : -1;
    if (p.swing > 0.4) p.side = right;
    const incoming = sh.live && sh.last !== i && side(i) * sh.z > -2, dist = Math.hypot(sh.x - p.x, sh.z - p.z);
    const high = p.kind === "smash" || p.kind === "clear" || (incoming && sh.y > 1.9);
    let arm, tw;
    if (p.swing < 0.3) { const e = 1 - Math.pow(1 - p.swing / 0.3, 2); arm = p.side > 0 ? lerp(0.1, 2.1, e) : lerp(2.8, 0.4, e); tw = p.side > 0 ? lerp(-0.3, 0.6, e) : lerp(0.35, -0.6, e); m.armA = arm; m.twist = tw; }
    else { const w = incoming ? clamp(1 - (dist - 0.6) / 2.4, 0, 1) : 0; arm = p.side > 0 ? lerp(0.9, -1.3, w) : lerp(0.9, 3.9, w); tw = p.side > 0 ? -0.7 * w : 0.7 * w;
      const k = Math.min(1, dt * 14); m.armA += (arm - m.armA) * k; m.twist += (tw - m.twist) * k; }
    m.arm.rotation.y = m.armA; m.upper.rotation.y = m.twist;
    m.armIn.rotation.z += ((high ? 1.05 : -0.35) - m.armIn.rotation.z) * Math.min(1, dt * 10);
  }

  Object.assign(GAME, {
    saveKey: "badminton3d-save",
    save: { mode: 1, diff: 1, auto: true, sound: true, record: [[0, 0], [0, 0], [0, 0]] },
    persist() { store.set(this.saveKey, this.save); },
    load(d) { if (d.mode === 1 || d.mode === 2) this.save.mode = d.mode; if ([0, 1, 2].includes(d.diff)) this.save.diff = d.diff; if (typeof d.sound === "boolean") this.save.sound = d.sound; if (typeof d.auto === "boolean") this.save.auto = d.auto; if (Array.isArray(d.record) && d.record.length === 3) this.save.record = d.record.map(r => [r[0] | 0, r[1] | 0]); },
    init() { buildScene(); fitCamera(); placeServe(); },
    onResize() { if (V.P) fitCamera(); },
    renderMenu() {
      const s = this.save, o = $("options"); o.innerHTML = "";
      o.appendChild(seg("Players", "modeSeg", [[1, "1 Player"], [2, "2 Players"]], s.mode, v => { s.mode = v; this.persist(); this.renderMenu(); fitCamera(); }));
      if (s.mode === 1) o.appendChild(seg("Computer", "diffSeg", [[0, "Easy"], [1, "Medium"], [2, "Hard"]], s.diff, v => { s.diff = v; this.persist(); this.renderMenu(); }));
      o.appendChild(seg("Running", "runSeg", [[true, "Auto-run"], [false, "I'll run"]], s.auto, v => { s.auto = v; this.persist(); this.renderMenu(); }));
      const r = s.record[s.diff];
      $("record").textContent = s.mode === 1 ? (r[0] + r[1] ? `Your ${AIL[s.diff].name} record: ${r[0]} wins, ${r[1]} losses` : "") : "Blue plays from the near side, Pink from the far side. Each player aims on their own half.";
      $("menuSub").textContent = (s.auto ? "Your player runs to the shuttle by themselves. You aim: point where you want it to land." : "Run to the shuttle yourself, and aim where you want it to land. Your player swings by themselves when it's in reach.") + " Aim deep for a high clear, short for a drop shot, and smash the high ones! First to 11.";
      $("help").innerHTML = (s.auto ? `<p><b>Aim</b> where you want the shuttle to land. Your player runs and swings by themselves.</p>` : `<p><b>Run:</b> WASD or the arrow keys, or drag on your side of the court. <b>Aim:</b> the mouse, or touch the other side (one hand runs, the other aims). Your player swings by themselves.</p><p><b>2 Players:</b> Blue WASD, Pink arrows, or your first finger runs and a second finger aims.</p>`) + `
        <p><b>Computer:</b> point the mouse. <b>iPad:</b> touch the spot. Tap or click to serve.</p>
        <p>Deep = high clear. Short = drop shot. When the shuttle comes in high, your player jumps and <b>smashes</b>. The shuttle can't touch the floor, and it must land inside the lines.</p>
        <p><b>2 Players:</b> each player touches their own half to aim. <b>P</b> pause · <b>F</b> full screen</p>`;
    },
    start() {
      score = [0, 0]; server = 0; pending = null; t = 0; rally = 0; flashAt = -9; this.outMark = null;
      aim[0].x = 0; aim[0].z = -4.5; aim[1].x = 0; aim[1].z = 4.5;
      fitCamera(); placeServe();
    },
    reset() { placeServe(); },
    update(dt) {
      t += dt;
      if (pending && t >= pending.at) { const pd = pending; pending = null; if (pd.over) return this.finish(); placeServe(); }
      if (sh.held && !pending && t >= serveAt) doServe();
      const two = this.save.mode === 2, L = AIL[this.save.diff];
      for (let k = 0; k < 4; k++) {
        const h = dt / 4;
        const auto = this.save.auto;
        if (auto) think(0, h, 4.3, 0.13, 0.25); else { const held = [...ptrs.values()].some(v => v.who === 0 && v.role === "move"); if (!keyMove(0, h) && !held && !sh.held) { /* stay where you are */ } move(pl[0], 0, h, 4.6); }
        if (two) { if (auto) think(1, h, 4.3, 0.13, 0.25); else { keyMove(1, h); move(pl[1], 1, h, 4.6); } } else think(1, h, L.speed, L.late, L.err * 0.25);
        if (!sh.held) {
          const pz = sh.z; step(sh, h);
          if (sh.live && pz * sh.z < 0 && sh.y < NET_H && Math.abs(sh.x) < DHW + 0.1) { sh.z = -Math.sign(sh.vz) * 0.05; sh.vz *= -0.15; sh.vx *= 0.3; noise("lowpass", 600, 200, 0.12, 0.2); }
          if (sh.y <= 0) {
            sh.y = 0; sh.vx = sh.vy = sh.vz = 0;
            if (sh.live) {
              const where = sh.z > 0 ? 0 : 1, inside = Math.abs(sh.x) <= HW + 0.02 && Math.abs(sh.z) <= HL + 0.02;
              if (sh.last === -1) point(1 - where, "miss");                  // the player on that side whiffed
              else if (where === sh.last) point(1 - sh.last, "net");
              else if (!inside) point(where, "out");
              else point(sh.last, "in");
              noise("lowpass", 900, 300, 0.08, 0.15);
            }
          }
        } else { const s = pl[server]; sh.x = s.x + 0.35 * side(server); sh.z = s.z - 0.25 * side(server); sh.y = 0.9 + Math.sin(t * 5) * 0.03; }
        tryHit(0); tryHit(1);
        pl[0].swing += h; pl[1].swing += h;
      }
      board([{ label: two ? "BLUE" : "YOU", value: score[0], color: "#3aa0ff" }, { label: two ? "PINK" : "CPU", value: score[1], color: "#ff4f9a" }]);
    },
    finish() {
      const win = score[0] > score[1], two = this.save.mode === 2;
      if (!two) { this.save.record[this.save.diff][win ? 0 : 1]++; this.persist(); }
      const r = this.save.record[this.save.diff];
      gameOver(two ? (win ? "BLUE WINS!" : "PINK WINS!") : (win ? "YOU WIN!" : "COMPUTER WINS"), [`${score[0]} – ${score[1]}`],
        two ? "" : `${AIL[this.save.diff].name} record: ${r[0]} wins, ${r[1]} losses`, win || two);
    },
    render(dt, st) {
      if (!V.P) return;
      if (st !== "play") { pl.forEach(p => { p.vx *= 0.9; p.vz *= 0.9; }); }
      pose(0, dt); pose(1, dt);
      V.sg.position.set(sh.x, sh.y + 0.03, sh.z);
      const sp = Math.hypot(sh.vx, sh.vy, sh.vz);
      if (sp > 0.5) V.sg.lookAt(sh.x + sh.vx, sh.y + 0.03 + sh.vy, sh.z + sh.vz); else V.sg.rotation.set(-Math.PI / 2, 0, 0);
      V.shadow.position.set(sh.x, 0.008, sh.z); const sc = 1 + sh.y * 0.25; V.shadow.scale.set(sc, sc, 1); V.shadow.material.opacity = Math.max(0.1, 0.4 - sh.y * 0.06);
      const showAim = st === "play" || st === "pause", pulse = 1 + Math.sin(performance.now() / 200) * 0.07;
      V.targets.forEach((g, i) => { g.visible = showAim && (i === 0 || this.save.mode === 2); g.position.set(aim[i].x, 0.01, aim[i].z); g.scale.set(pulse, 1, pulse); });
      const om = this.outMark, oa = om ? Math.max(0, 1 - (t - om.at) / 2.2) : 0;
      V.outX.visible = oa > 0; if (oa > 0) { V.outX.position.set(om.x, 0.012, om.z); V.outX.children.forEach(c => c.material.opacity = oa); }
    },
  });
  if (DEBUG) window.__bd = { predict, ptrs, sh, pl, aim, score: () => score, toScreen, toFloor, simulate, solve, step };

  // ---------- flow buttons ----------
  $("playBtn").addEventListener("click", startGame);
  $("againBtn").addEventListener("click", startGame);
  $("resumeBtn").addEventListener("click", resume);
  $("restartBtn").addEventListener("click", () => { state = "play"; GAME.start(); show(null); canvas.focus(); });
  $("quitBtn").addEventListener("click", quit);
  $("menuBtn2").addEventListener("click", quit);
  $("pauseBtn").addEventListener("click", pauseGame);
  $("fsBtn").addEventListener("click", toggleFull); $("fsMenuBtn").addEventListener("click", toggleFull);
  $("helpBtn").addEventListener("click", () => $("help").classList.toggle("hidden"));
  $("soundBtn").addEventListener("click", () => { soundOn = !soundOn; GAME.save.sound = soundOn; GAME.persist(); $("soundBtn").textContent = "Sound: " + (soundOn ? "on" : "off"); });
  addEventListener("resize", () => { if (G) G.resize(); if (GAME.onResize) GAME.onResize(); });
  for (const ev of ["fullscreenchange", "webkitfullscreenchange"]) document.addEventListener(ev, () => { if (G) G.resize(); if (GAME.onResize) GAME.onResize(); });
  document.addEventListener("visibilitychange", () => { if (document.hidden && state === "play") pauseGame(); });
  // ---------- boot + loop ----------
  (async () => {
    const d = await store.get(GAME.saveKey);
    if (d && typeof d === "object") GAME.load(d);
    soundOn = GAME.save.sound !== false;
    $("soundBtn").textContent = "Sound: " + (soundOn ? "on" : "off");
    GAME.renderMenu();
  })();
  if (G) GAME.init();
  GAME.renderMenu();
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
    if (G) {
      if (state === "play") GAME.update(dt);
      GAME.render(dt, state);
      G.renderer.render(G.scene, G.camera);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  if (DEBUG) window.__g = { GAME: () => GAME, state: () => state, keys };
})();
</script>
</body>
