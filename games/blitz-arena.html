<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<script>
/* Saving: use the host's storage when it has one (Claude preview); otherwise this browser's own storage. */
(function () {
  try { if (!window.storage && window.parent !== window && window.parent.storage) window.storage = window.parent.storage; } catch (e) {}
  if (!window.storage) {
    window.storage = {
      get: async function (k) { try { var v = localStorage.getItem(k); return v == null ? null : { key: k, value: v }; } catch (e) { return null; } },
      set: async function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} return { key: k, value: v }; }
    };
  }
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Blitz Arena</title>
<style>
  :root {
    --panel: rgba(14, 16, 30, 0.66);
    --sheet: rgba(16, 18, 34, 0.92);
    --ink: #ffffff;
    --muted: #b6bbd6;
    --line: rgba(255, 255, 255, 0.16);
    --gold: #ffcd3c;
    --gold-deep: #8a5a00;
    --red: #ff4b4b;
    --hp: #45e07c;
    --scrim: linear-gradient(180deg, rgba(8, 10, 24, 0.35), rgba(8, 10, 24, 0.75));
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --panel: rgba(6, 7, 16, 0.74);
      --sheet: rgba(10, 11, 22, 0.94);
      --ink: #f4f5ff;
      --muted: #a6abc8;
      --line: rgba(255, 255, 255, 0.14);
      --gold: #ffd257;
      --gold-deep: #7a4e00;
      --red: #ff6363;
      --hp: #4fe887;
      --scrim: linear-gradient(180deg, rgba(4, 5, 12, 0.45), rgba(4, 5, 12, 0.82));
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--ink);
    font-family: "Avenir Next", "Trebuchet MS", system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  .hidden { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  /* ---------- Screens ---------- */
  .screen { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: center; justify-content: center;
    padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom)); }
  .menuCol { display: flex; flex-direction: column; align-items: center; gap: 14px; width: min(420px, 100%); text-align: center; }
  .logo { margin: 0 0 4px; font-size: clamp(48px, 14vw, 88px); font-weight: 900; line-height: 0.88; letter-spacing: -2px;
    color: var(--gold); text-shadow: 0 5px 0 var(--gold-deep), 0 12px 30px rgba(0,0,0,0.5); transform: rotate(-3deg); }
  .sheet { background: var(--sheet); border: 1px solid var(--line); border-radius: 20px; padding: 18px; width: min(460px, 100%);
    max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .sheet.wide { width: min(760px, 100%); }
  .sheet h2 { margin: 0; font-size: 24px; font-weight: 900; }
  .sub { margin: -6px 0 0; color: var(--muted); font-size: 14px; line-height: 1.4; }

  .big { border: 0; border-radius: 14px; padding: 14px 26px; font-size: 20px; font-weight: 900; color: #2a1600;
    background: var(--gold); box-shadow: 0 5px 0 var(--gold-deep); width: 100%; }
  .big:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--gold-deep); }
  .mid { border: 2px solid var(--line); background: var(--panel); border-radius: 12px; padding: 11px 16px; font-weight: 800; font-size: 16px; width: 100%; }
  .row { display: flex; gap: 10px; width: 100%; }

  .seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 4px; width: 100%; }
  .seg button { flex: 1; border: 0; background: transparent; border-radius: 10px; padding: 10px; font-weight: 800; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #14162a; }
  #modeDesc { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.4; min-height: 2.8em; }

  /* Loadout */
  #gunGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
  .gun { text-align: left; border: 2px solid var(--line); background: var(--panel); border-radius: 12px; padding: 10px; }
  .gun.sel { border-color: var(--gold); }
  .gun b { display: flex; align-items: center; gap: 8px; font-size: 15px; }
  .gun b i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
  .stat { display: grid; grid-template-columns: 64px 1fr; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); margin-top: 5px; }
  .stat span { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .stat span em { display: block; height: 100%; background: var(--ink); border-radius: 3px; }

  /* Settings */
  .setting { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-weight: 700; }
  .setting input[type=range] { flex: 1; max-width: 220px; accent-color: var(--gold); }
  .setting input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--gold); }

  /* Vote */
  #voteTop { display: flex; justify-content: space-between; align-items: baseline; }
  #voteLeft { font-weight: 900; font-size: 22px; color: var(--gold); }
  #voteTimer { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  #voteBar { height: 100%; background: var(--gold); width: 100%; }
  #mapCards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
  .map { position: relative; border: 3px solid transparent; border-radius: 16px; padding: 0; overflow: hidden; text-align: left; min-height: 150px;
    display: flex; flex-direction: column; justify-content: flex-end; }
  .map .art { position: absolute; inset: 0; }
  .map .info { position: relative; padding: 10px 12px; background: linear-gradient(180deg, transparent, rgba(0,0,0,0.72)); color: #fff; }
  .map .info b { display: block; font-size: 19px; font-weight: 900; }
  .map .info small { display: block; font-size: 12px; opacity: 0.85; margin-top: 2px; }
  .map .info .voters { margin-top: 6px; font-size: 12px; font-weight: 700; min-height: 1.2em; }
  .map .count { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6); color: #fff; font-weight: 900; border-radius: 999px; padding: 3px 10px; font-size: 14px; }
  .map.mine { border-color: #fff; }
  .map.win { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(255, 205, 60, 0.35); }
  .map.lose { opacity: 0.45; }

  /* Results */
  #resTable { width: 100%; border-collapse: collapse; font-size: 15px; }
  #resTable th { text-align: left; color: var(--muted); font-size: 12px; font-weight: 700; padding: 4px 6px; }
  #resTable td { padding: 7px 6px; border-top: 1px solid var(--line); font-weight: 700; }
  #resTable tr.me td { color: var(--gold); }
  #resTable td.n { text-align: right; } #resTable th.n { text-align: right; }

  /* ---------- HUD ---------- */
  .panel { position: fixed; background: var(--panel); border-radius: 12px; pointer-events: none; }
  #weapon { top: max(8px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); padding: 6px 14px 8px; min-width: 214px; }
  #wName { font-weight: 800; font-size: 15px; }
  #wProg { float: right; color: var(--gold); font-weight: 800; font-size: 13px; margin-top: 1px; }
  #ammo { font-weight: 900; font-size: 24px; line-height: 1.1; }
  #hpWrap { height: 8px; background: rgba(255,255,255,0.18); border-radius: 4px; margin-top: 5px; overflow: hidden; }
  #hp { height: 100%; width: 100%; background: var(--hp); border-radius: 4px; }
  #pauseBtn { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 8px; width: 40px; height: 40px; border-radius: 10px;
    border: 0; background: var(--panel); font-weight: 900; font-size: 15px; letter-spacing: 1px; }
  #board { top: calc(max(8px, env(safe-area-inset-top)) + 46px); left: 8px; padding: 6px 10px; font-size: 12px; font-weight: 700; min-width: 120px; }
  #board div { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); }
  #board div.me { color: var(--gold); }
  #feed { position: fixed; top: max(8px, env(safe-area-inset-top)); right: 8px; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; pointer-events: none; }
  #feed div { background: var(--panel); padding: 3px 9px; border-radius: 7px; font-size: 12px; font-weight: 700; }
  #feed div.mine { background: rgba(200, 40, 40, 0.78); }
  #cross { position: fixed; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; }
  #cross i { position: absolute; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.45); }
  #hit { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -52%); font-size: 30px; font-weight: 900; opacity: 0; pointer-events: none; }
  #announce { position: fixed; left: 50%; top: 27%; transform: translate(-50%, -50%); width: 90vw; text-align: center;
    font-size: clamp(20px, 5vw, 34px); font-weight: 900; color: var(--gold); text-shadow: 0 2px 0 #000, 0 0 12px rgba(0,0,0,0.6);
    opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(255, 30, 30, 0.6) 100%); }
  .btn { position: fixed; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-align: center;
    font-weight: 900; font-size: 12px; color: var(--ink); background: var(--panel); border: 2px solid rgba(255,255,255,0.35); touch-action: none; }
  #fire { width: 92px; height: 92px; right: 22px; bottom: 34px; background: rgba(215, 45, 45, 0.8); font-size: 16px; }
  #reload { width: 58px; height: 58px; right: 40px; bottom: 140px; }
  #dash { width: 62px; height: 62px; right: 128px; bottom: 30px; }
  #heal { width: 62px; height: 62px; right: 128px; bottom: 102px; }
  .btn.cd { opacity: 0.45; }
  #joyBase, #joyKnob { position: fixed; border-radius: 50%; pointer-events: none; display: none; }
  #joyBase { width: 120px; height: 120px; margin: -60px 0 0 -60px; border: 3px solid rgba(255,255,255,0.45); }
  #joyKnob { width: 52px; height: 52px; margin: -26px 0 0 -26px; background: rgba(255,255,255,0.55); }
  #keys { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); font-size: 13px; color: var(--muted);
    background: var(--panel); padding: 5px 12px; border-radius: 9px; pointer-events: none; white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { #announce { transition: none; } }
  /* Economy + inventory */
  .coinTag { margin: 0; font-weight: 900; color: var(--gold); font-size: 16px; }
  .armTop { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .gun { display: flex; flex-direction: column; }
  .gun .buy { margin-top: 9px; border: 0; border-radius: 9px; padding: 8px; font-weight: 900; font-size: 14px;
    background: var(--line); color: var(--muted); }
  .gun .buy.can { background: var(--gold); color: #2a1600; }
  .gun .buy:not(:disabled):not(.can) { background: var(--ink); color: #14162a; }
  #coins { margin-top: 4px; font-size: 13px; font-weight: 800; color: var(--gold); }
  #coinPop { position: fixed; left: 50%; top: 58%; transform: translate(-50%, 0); font-size: 20px; font-weight: 900; color: var(--gold);
    text-shadow: 0 2px 0 #000; opacity: 0; pointer-events: none; white-space: nowrap; }
  #slots { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(12px, env(safe-area-inset-bottom)); display: flex; gap: 6px; }
  #slots button { min-width: 84px; max-width: 120px; border: 2px solid rgba(255,255,255,0.25); background: var(--panel); border-radius: 11px;
    padding: 5px 8px; text-align: left; touch-action: none; }
  #slots button b { display: block; font-size: 11px; color: var(--muted); }
  #slots button span { display: block; font-size: 12px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #slots button.on { border-color: var(--gold); }
  #slots button.on b { color: var(--gold); }
  #keys { bottom: 66px; }
  #viewBtn { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 54px; width: 40px; height: 40px; border-radius: 10px;
    border: 0; background: var(--panel); font-size: 18px; }
  #board { top: calc(max(8px, env(safe-area-inset-top)) + 46px); }
  #jump { width: 80px; height: 80px; right: 20px; bottom: 26px; background: rgba(60, 140, 255, 0.75); font-size: 14px; }
  #fire { right: 112px; bottom: 70px; }
  #reload { right: 30px; bottom: 124px; }
  #dash { right: 214px; bottom: 26px; }
  #heal { right: 214px; bottom: 96px; }
  @media (pointer: coarse) { #slots { top: calc(max(8px, env(safe-area-inset-top)) + 84px); bottom: auto; } }
  .note { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    background: rgba(255, 205, 60, 0.14); border: 1px solid var(--gold); border-radius: 12px; padding: 10px 12px; font-size: 14px; font-weight: 700; }
  .note button { border: 0; border-radius: 9px; padding: 8px 12px; font-weight: 900; background: var(--gold); color: #2a1600; }
  #loadoutStrip { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 6px; width: 100%; }
  #loadoutStrip button { text-align: left; border: 2px solid var(--line); background: var(--panel); border-radius: 12px; padding: 7px 9px; }
  #loadoutStrip button:first-child { border-color: var(--gold); }
  #loadoutStrip small { display: block; font-size: 11px; color: var(--muted); font-weight: 700; }
  #loadoutStrip b { display: flex; align-items: center; gap: 6px; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #loadoutStrip i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  #loadoutStrip button.off { opacity: 0.55; }
  #loadoutHint { margin: -6px 0 0; text-align: center; min-height: 0; }
  .newTag { margin-left: auto; font-style: normal; font-size: 10px; font-weight: 900; letter-spacing: 0.5px; color: #2a1600;
    background: var(--gold); border-radius: 6px; padding: 2px 6px; }
  #keys { max-width: 94vw; white-space: normal; text-align: center; line-height: 1.4; }
  canvas:focus { outline: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<!-- HUD -->
<div id="hud" class="hidden">
  <button id="pauseBtn" aria-label="Pause">II</button>
  <button id="viewBtn" aria-label="Switch camera view">👁</button>
  <div id="board" class="panel"></div>
  <div id="weapon" class="panel"><span id="wProg"></span><div id="wName"></div><div id="ammo"></div><div id="hpWrap"><div id="hp"></div></div><div id="coins"></div></div>
  <div id="feed"></div>
  <div id="cross"><i></i><i></i><i></i><i></i></div>
  <div id="hit">✕</div>
  <div id="flash"></div>
  <div id="joyBase"></div><div id="joyKnob"></div>
  <div id="touchUI" class="hidden">
    <div class="btn" id="fire">FIRE</div>
    <div class="btn" id="jump">JUMP</div>
    <div class="btn" id="reload">RELOAD</div>
    <div class="btn" id="dash">DASH</div>
    <div class="btn" id="heal">HEAL</div>
  </div>
  <div id="slots">
    <button><b>1</b><span></span></button>
    <button><b>2</b><span></span></button>
    <button><b>3</b><span></span></button>
  </div>
  <div id="coinPop"></div>
  <div id="keys" class="hidden">WASD move · mouse aim · click shoot · W/S move · A/D turn · Arrows or mouse aim · Shift, F or click shoot · Space jump (hold at walls to climb) · 1/2/3 switch · R reload · Q dash · E heal · V camera · Esc pause</div>
</div>
<div id="announce"></div>

<!-- Main menu -->
<div id="menu" class="screen">
  <div class="menuCol">
    <h1 class="logo">BLITZ<br>ARENA</h1>
    <div class="seg">
      <button data-mode="ffa">Free-for-All</button>
      <button data-mode="gg">Gun Game</button>
    </div>
    <p id="modeDesc"></p>
    <p id="menuCoins" class="coinTag"></p>
    <div id="loadoutStrip" aria-label="Your loadout"></div>
    <p id="loadoutHint" class="sub"></p>
    <button class="big" id="playBtn">Play</button>
    <div class="row">
      <button class="mid" id="armoryBtn">Armory</button>
      <button class="mid" id="settingsBtn">Settings</button>
    </div>
  </div>
</div>

<!-- Armory -->
<div id="armory" class="screen hidden">
  <div class="sheet wide">
    <div class="armTop"><h2>Armory</h2><span class="coinTag" id="armCoins"></span></div>
    <p class="sub" id="armNote"></p>
    <div id="ggNote" class="note hidden"><span></span><button id="toFfa">Switch to Free-for-All</button></div>
    <div class="seg tabs">
      <button data-tab="primary">Big guns</button>
      <button data-tab="secondary">Pistols</button>
      <button data-tab="melee">Melee</button>
    </div>
    <div id="gunGrid"></div>
    <button class="mid" id="armBack">Done</button>
  </div>
</div>

<!-- Settings -->
<div id="settings" class="screen hidden">
  <div class="sheet">
    <h2>Settings</h2>
    <label class="setting">Aim sensitivity <input type="range" id="sens" min="0.4" max="2" step="0.1"></label>
    <label class="setting">Sound <input type="checkbox" id="sound"></label>
    <button class="mid" data-back>Done</button>
  </div>
</div>

<!-- Map vote -->
<div id="vote" class="screen hidden">
  <div class="sheet wide">
    <div id="voteTop"><h2>Vote for the map</h2><span id="voteLeft">8</span></div>
    <div id="voteTimer"><div id="voteBar"></div></div>
    <div id="mapCards"></div>
  </div>
</div>

<!-- Results -->
<div id="results" class="screen hidden">
  <div class="sheet">
    <h2 id="resTitle"></h2>
    <table id="resTable"></table>
    <p id="resCoins" class="coinTag"></p>
    <button class="big" id="nextBtn">Next match</button>
    <button class="mid" id="resArmory">Spend coins in the Armory</button>
    <button class="mid" id="menuBtn">Main menu</button>
  </div>
</div>

<!-- Pause -->
<div id="pause" class="screen hidden">
  <div class="sheet">
    <h2>Paused</h2>
    <button class="big" id="resumeBtn">Resume</button>
    <button class="mid" id="pauseArmory">Armory</button>
    <button class="mid" id="leaveBtn">Leave match</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const isTouch = "ontouchstart" in window || navigator.maxTouchPoints > 0;
  const $ = id => document.getElementById(id);

  // =====================================================================
  // Weapons catalog
  //   kind "gun"   = hitscan guns     kind "bow" = hold to draw, arrows drop

  // =====================================================================

    { id: "sawedoff", name: "Sawed-Off", slot: "secondary", kind: "gun", model: "sawedoff", price: 750, color: 0x6b4428, isNew: true,

    { id: "goldendeagle", name: "Golden Deagle", slot: "secondary", kind: "gun", model: "deagle", price: 0, color: 0xffc83a, ggOnly: true,

    // ---- Big guns (primary) ----
    { id: "smg", name: "SMG", slot: "primary", kind: "gun", model: "smg", price: 0, color: 0x4aa8e8,

    { id: "ar", name: "Assault Rifle", slot: "primary", kind: "gun", model: "rifle", price: 600, color: 0x6a8a4a,

    { id: "burst", name: "Burst Rifle", slot: "primary", kind: "gun", model: "burst", price: 950, color: 0x3a4a6a,

    { id: "pump", name: "Pump Shotgun", slot: "primary", kind: "gun", model: "shotgun", price: 700, color: 0x3a3d44,
      damage: 13, rpm: 75, auto: false, mag: 6, reload: 2.2, spread: 6.0, range: 90, headshot: 1.4, pellets: 8 },

  function yardFence(cx, cz, R, def) {

    for (const [x1, z1, x2, z2, gate] of sides) {

      for (let i = 0; i <= n; i++) {

  // Push p out of obstacles. Things you're standing on top of don't block you.

      const dx = p.x - cx, dz = p.z - cz, d2 = dx * dx + dz * dz;

      if (d2 > 1e-6) { const d = Math.sqrt(d2); p.x = cx + dx / d * r; p.z = cz + dz / d * r; }

  function startVote() {

      bots: bots.map(b => ({ name: b.name, at: rt + 0.8 + Math.random() * 5.5, pick: Math.floor(Math.random() * MAPS.length), done: false })) };
    const cards = $("mapCards"); cards.innerHTML = "";

      c.innerHTML = `<div class="art" style="background:${m.css}"></div><span class="count">0</span>` +
        `<div class="info"><b>${m.name}</b><small>${m.tag}</small><div class="voters"></div></div>`;

  function renderVote() {
    const counts = MAPS.map(() => 0), voters = MAPS.map(() => []);
    if (vote.mine !== null) { counts[vote.mine]++; voters[vote.mine].push("You"); }
    for (const bv of vote.bots) if (bv.done) { counts[bv.pick]++; voters[bv.pick].push(bv.name); }
    [...$("mapCards").children].forEach((c, i) => {

          Object.assign($("joyKnob").style, { display: "block", left: t.clientX + "px", top: t.clientY + "px" });

  const GAME_KEYS = new Set([" ", "arrowup", "arrowdown", "arrowleft", "arrowright", "enter"]);

  // =====================================================================
  // Abilities
  // =====================================================================
  const DASH_CD = 4, HEAL_CD = 15;

  const dashDir = new THREE.Vector3(), moveVec = new THREE.Vector3();
  function dash() {
    if (state !== "playing" || now - lastDash < DASH_CD || !player.alive) return;
    lastDash = now;
    if (moveVec.lengthSq() > 0.01) dashDir.copy(moveVec).normalize();
    else dashDir.set(-Math.sin(yaw), 0, -Math.cos(yaw));
    dashUntil = now + 0.18;
  }
  function heal() {
    if (state !== "playing" || now - lastHeal < HEAL_CD || !player.alive) return;

  }

  // =====================================================================
  // Main loop
  // =====================================================================
  let last = performance.now(), rt = 0, boardTimer = 0;
  const PLAYER_G = 50, JUMP_V = 19, CLIMB_V = 10;
  let jumpQueued = 0, jumpHeld = false, climbing = false, thirdPerson = false;

  const CAM_BACK = new THREE.Vector3(1.6, 1.3, 11);
  const _cam = new THREE.Vector3(), _head = new THREE.Vector3();
  function updateCamera() {
    const p = player;
    camera.rotation.set(pitch, yaw, 0);
    if (!thirdPerson) camera.position.set(p.pos.x, p.pos.y + 4.5, p.pos.z);
    else {
      _head.set(p.pos.x, p.pos.y + 4.8, p.pos.z);
      _cam.copy(CAM_BACK).applyQuaternion(camera.quaternion);
      const len = _cam.length(); _cam.divideScalar(len);
      raycaster.set(_head, _cam); raycaster.far = len;
      let d = len;
      const hits = raycaster.intersectObjects(mapShootables, false);
      if (hits.length) d = Math.max(1.5, hits[0].distance - 0.6);
      d = Math.min(d, Math.max(1.5, terrainHit(_head, _cam, d) - 0.6));
      camera.position.copy(_head).addScaledVector(_cam, d);
      camera.position.y = Math.max(camera.position.y, heightAt(camera.position.x, camera.position.z) + 0.6);
    }
    camera.updateMatrixWorld();
  }
  function toggleView() {
    if (state !== "playing") return;
    thirdPerson = !thirdPerson; settings.tp = thirdPerson; saveSettings();
    announce(thirdPerson ? "Third-person view" : "First-person view", 1);
  }
  function animateAvatar(dt, firstPerson) {
    const av = player.avatar, p = player;
    av.group.visible = firstPerson && thirdPerson && p.alive;
    av.group.position.copy(p.pos);
    av.group.rotation.y = yaw + Math.PI;
    const moving = moveVec.lengthSq() > 0.01;
    if (!p.grounded) { av.legL.rotation.x = 0.5; av.legR.rotation.x = -0.3; }
    else if (moving) { p.walk += dt * 10; const s = Math.sin(p.walk) * 0.6; av.legL.rotation.x = s; av.legR.rotation.x = -s; }
    else { av.legL.rotation.x *= 0.8; av.legR.rotation.x *= 0.8; }
  }

  function updatePlayer(dt) {
    const p = player;
    if (!p.alive) return;
    let mx = joy.x, mz = joy.y;
    if (keys["w"]) mz -= 1;
    if (keys["s"]) mz += 1;
    // A/D and the left/right arrows turn you all the way around; up/down arrows look up and down
    const turn = (keys["a"] || keys["arrowleft"] ? 1 : 0) - (keys["d"] || keys["arrowright"] ? 1 : 0), tilt = (keys["arrowup"] ? 1 : 0) - (keys["arrowdown"] ? 1 : 0);
    if (turn || tilt) {
      yaw += turn * 2.4 * settings.sens * dt;
      pitch = Math.max(-1.55, Math.min(1.55, pitch + tilt * 1.6 * settings.sens * dt));
    }
    const m = Math.hypot(mx, mz);
    if (m > 1) { mx /= m; mz /= m; }
    const fx = -Math.sin(yaw), fz = -Math.cos(yaw), rx = Math.cos(yaw), rz = -Math.sin(yaw);
    moveVec.set(rx * mx - fx * mz, 0, rz * mx - fz * mz);
    const w = weaponOf(p);
    const speed = w.kind === "melee" ? 17.5 : w.model === "minigun" ? 12 : 16;
    p.pos.addScaledVector(moveVec, speed * (p.grounded ? 1 : 0.85) * dt);
    if (now < dashUntil) p.pos.addScaledVector(dashDir, 85 * dt);
    const onWall = collide(p.pos, 1.2, p.pos.y);
    const ground = groundAt(p.pos.x, p.pos.z, p.pos.y);
    if (jumpQueued && now - jumpQueued < 0.15 && p.grounded) { p.vy = JUMP_V; p.grounded = false; jumpQueued = 0; jumpSound(); }
    // Hold jump while walking into a wall, hay or a rock to climb it
    climbing = jumpHeld && onWall && moveVec.lengthSq() > 0.01;
    if (climbing) { p.vy = CLIMB_V; p.grounded = false; }
    if (p.grounded) {
      if (ground >= p.pos.y - 1.2) p.pos.y = ground; else p.grounded = false;
    }
    if (!p.grounded) {
      if (!climbing) p.vy = Math.max(-80, p.vy - PLAYER_G * dt);
      p.pos.y += p.vy * dt;
      const g2 = groundAt(p.pos.x, p.pos.z, p.pos.y);
      if (p.pos.y <= g2 && p.vy <= 0) { if (p.vy < -30) landSound(); p.pos.y = g2; p.vy = 0; p.grounded = true; }
      else if (p.pos.y < g2) p.pos.y = g2;
    }
    updateCamera();

    if (now < p.healUntil) p.hp = Math.min(100, p.hp + 20 * dt);
    else if (now - p.lastHurt > 4) p.hp = Math.min(100, p.hp + 5 * dt);

    const s = slotState[cur];
    if (s.reloading && now >= s.reloadDoneAt) { s.reloading = false; s.ammo = w.mag; updateHud(); }
    const ready = roundActive && now >= switchReadyAt;

    if (w.kind === "melee") {
      if (holding && ready && now - lastShot >= 60 / w.rate) { lastShot = now; swingMelee(w); }
    } else if (w.kind === "bow") {
      if (holding && ready && !drawStart && now >= bowReadyAt) drawStart = now;
      if (!holding && drawStart) {
        const charge = Math.min(1, (now - drawStart) / w.draw);
        drawStart = 0;
        if (charge > 0.15) { playerArrow(w, charge); bowReadyAt = now + 0.35; }
      }
      if (!ready) drawStart = 0;
    } else {
      if (w.spinup) spin = holding && ready && !s.reloading ? Math.min(1, spin + dt / w.spinup) : Math.max(0, spin - dt * 1.5);
      const fireOnce = () => {
        s.ammo--;
        if (w.kind === "xbow") playerArrow(w, 1); else playerShoot(w);
        updateHud();
      };
      if (burstLeft > 0) {
        if (s.ammo <= 0) burstLeft = 0;
        else if (now >= nextBurstAt) { fireOnce(); burstLeft--; nextBurstAt = now + 0.07; }
      } else if (holding && ready && !s.reloading && (w.auto || !firedThisPress) && (!w.spinup || spin >= 1) && now - lastShot >= 60 / w.rpm) {
        if (s.ammo <= 0) reload();
        else {
          lastShot = now; firedThisPress = true;
          if (w.burst) { burstLeft = w.burst - 1; nextBurstAt = now + 0.07; }
          fireOnce();
        }
      }
      if (s.ammo <= 0 && !s.reloading && burstLeft === 0) reload();
    }
  }

  // Held weapon: drawn at half size in the lower right, kept in front of the camera on every screen shape
  const VM_SCALE = 0.5;
  function animateViewmodel(dt, firstPerson) {
    if (!viewmodel) return;
    viewmodel.visible = firstPerson && player.alive && !thirdPerson;
    const w = weaponOf(player);
    switchT += dt; swingT += dt;
    const raise = 1 - Math.min(1, switchT / 0.3);
    const ax = Math.min(0.24, camera.aspect * 0.3);   // stay on screen in portrait too
    viewmodel.scale.setScalar(VM_SCALE);
    viewmodel.rotation.set(0, 0, 0);
    if (vmKind === "melee") {
      const k = Math.min(1, swingT / 0.28), s = Math.sin(k * Math.PI) * (k < 1 ? 1 : 0);
      viewmodel.position.set(ax + 0.02 - 0.22 * s, -0.26 - raise * 0.3, -0.58 - 0.06 * s);
      viewmodel.rotation.set(0.25 - 0.9 * s, -1.1 * s, 0);
    } else if (vmKind === "bow") {
      const ch = drawStart ? Math.min(1, (now - drawStart) / w.draw) : 0, pull = ch * 0.35;
      viewmodel.position.set(0.04, -0.1 - raise * 0.3, -0.62 + kick * 0.03);
      viewmodel.rotation.z = 0.12;
      viewmodel.userData.string.position.z = viewmodel.userData.restZ + pull;
      viewmodel.userData.arrow.position.z = viewmodel.userData.restZ + pull;
      viewmodel.userData.arrow.visible = now >= bowReadyAt;
      viewmodel.userData.rightArm.position.z = pull;
    } else if (vmKind === "minigun") {
      const shake = spin >= 1 && holding ? (Math.random() - 0.5) * 0.006 : 0;
      viewmodel.position.set(ax + shake, -0.3 - raise * 0.3 + shake, -0.62 + kick * 0.02);
      viewmodel.userData.spin.rotation.z += spin * dt * 40;
    } else {
      viewmodel.position.set(ax, -0.22 + kick * 0.015 - raise * 0.3, -0.62 + kick * 0.05);
      viewmodel.rotation.x = kick * 0.12;
    }
  }

  function frame(t) {
    const dt = Math.min(0.05, (t - last) / 1000); last = t; rt += dt;

    if (state === "playing") {
      now += dt;
      if (!roundActive && resultsAt && now >= resultsAt) { resultsAt = 0; showResults(); }
      for (const f of fighters) if (!f.alive && roundActive && now >= f.respawnAt) respawn(f);
      updatePlayer(dt);
      for (const b of bots) updateBot(b, dt);
      updateArrows(dt);
      boardTimer -= dt;
      if (boardTimer <= 0) { boardTimer = 0.5; updateBoard(); }
    } else if (state !== "paused") {
      for (const b of bots) updateBot(b, dt);
      if (state === "vote" && vote) updateVote();
    }
    updateTracers(dt);

    const firstPerson = state === "playing" || state === "paused";
    if (firstPerson) {
      updateCamera();
    } else {
      const a = rt * 0.07;
      camera.position.set(Math.sin(a) * 240, 95, Math.cos(a) * 240);
      camera.lookAt(0, 0, 0);
    }
    kick = Math.max(0, kick - dt * 10);
    bloom = Math.max(0, bloom - dt * 40);
    animateViewmodel(dt, firstPerson);
    animateAvatar(dt, firstPerson);

    if (state === "playing") {
      const w = weaponOf(player);
      const gap = w.kind === "bow" ? 16 - (drawStart ? Math.min(1, (now - drawStart) / w.draw) : 0) * 12
        : w.kind === "melee" ? 4 : 8 + bloom + (w.spread || 0) * 3;
      layoutCross(gap);
      $("hp").style.width = Math.max(0, player.hp) + "%";
      $("hp").style.background = player.hp < 35 ? "var(--red)" : "var(--hp)";
      hitT += dt; $("hit").style.opacity = Math.max(0, 1 - hitT / 0.25);
      flashT += dt; $("flash").style.opacity = Math.max(0, 0.9 - flashT * 2.5);
      coinT += dt;
      $("coinPop").style.opacity = Math.max(0, 1 - Math.max(0, coinT - 0.9) / 0.4);
      $("coinPop").style.transform = `translate(-50%, ${-coinT * 18}px)`;
      if (isTouch) {
        const dl = DASH_CD - (now - lastDash), hl = HEAL_CD - (now - lastHeal);
        $("dash").classList.toggle("cd", dl > 0); $("heal").classList.toggle("cd", hl > 0);
        $("dash").textContent = dl > 0 ? Math.ceil(dl) : "DASH";
        $("heal").textContent = hl > 0 ? Math.ceil(hl) : "HEAL";
        $("fire").textContent = w.kind === "melee" ? "SWING" : w.kind === "bow" ? "DRAW" : "FIRE";
      }
      if (!player.alive) updateHud();
    }

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  // =====================================================================
  // Boot: show a live map behind the menu
  // =====================================================================
  sanitize();
  buildMap(MAPS[0]);
  for (const f of fighters) respawn(f);
  applyMenuUI();
  loadSettings();
  setState("menu", "menu");
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
