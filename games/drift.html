<script>
/* Saving: use the host's storage when it has one (Claude preview); otherwise this browser's own storage. */
(function () {
  try { if (!window.storage && window.parent !== window && window.parent.storage) window.storage = window.parent.storage; } catch (e) {}
  if (!window.storage) {
    window.storage = {
      get: async function (k) { try { var v = localStorage.getItem(k); return v == null ? null : { key: k, value: v }; } catch (e) { return null; } },
      set: async function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} return { key: k, value: v }; }
    };
  }
})();
</script>

<script>

      const crowdTex = () => canvasTex(512, 128, (g, w, h) => {
        g.fillStyle = "#3a4250"; g.fillRect(0, 0, w, h);
        const cols = ["#e74c3c", "#3498db", "#f1c40f", "#ecf0f1", "#2ecc71", "#9b59b6", "#e67e22", "#1abc9c", "#34495e"];
        for (let row = 0; row < 4; row++) for (let x = 6; x < w; x += 12) {
          if (Math.random() < 0.12) continue;
          const y = 18 + row * 30 + (Math.random() - 0.5) * 3;
          g.fillStyle = cols[(Math.random() * cols.length) | 0]; g.fillRect(x - 5, y, 10, 12);

      });
      // a person: legs that run, a body that turns, an arm that can swing something
      function person(shirt, opts = {}) {
        const g = new T3.Group(), skin = lam(opts.skin || 0xe0ac69), top = lam(shirt), bottom = lam(opts.pants || 0xf4f4f4), shoe = lam(opts.shoes || 0xffffff);
        const legGeo = new T3.CylinderGeometry(0.06, 0.05, 0.8, 8); legGeo.translate(0, -0.4, 0);
        const legs = [-0.1, 0.1].map(x => { const leg = mesh(legGeo, opts.longPants ? bottom : skin, true); leg.position.set(x, 0.86, 0);
          const sh = mesh(new T3.BoxGeometry(0.11, 0.08, 0.24), shoe, true); sh.position.set(0, -0.78, -0.04); leg.add(sh); g.add(leg); return leg; });
        const hips = mesh(new T3.CylinderGeometry(0.17, 0.18, 0.26, 12), bottom, true); hips.position.y = 0.92; g.add(hips);
        const upper = new T3.Group(); upper.position.y = 1.02; g.add(upper);
        const torso = mesh(new T3.CylinderGeometry(0.17, 0.19, 0.55, 12), top, true); torso.position.y = 0.27; upper.add(torso);
        const head = mesh(new T3.SphereGeometry(0.14, 16, 12), skin, true); head.position.y = 0.72; upper.add(head);
        if (opts.cap !== false) {

          const visor = mesh(new T3.BoxGeometry(0.17, 0.02, 0.13), lam(opts.cap || shirt), true); visor.position.set(0, 0.735, -0.18); upper.add(visor);
        }
        const offArm = new T3.Group(); offArm.position.set(-0.23, 0.48, 0); upper.add(offArm);
        const oa = mesh(new T3.CylinderGeometry(0.045, 0.038, 0.5, 8), skin, true); oa.position.y = -0.24; offArm.add(oa); offArm.rotation.z = -0.2;
        const arm = new T3.Group(); arm.position.set(0.23, 0.48, 0); upper.add(arm);
        const armIn = new T3.Group(); arm.add(armIn); armIn.rotation.z = -0.4;
        const ua = mesh(new T3.CylinderGeometry(0.045, 0.038, 0.48, 8), skin, true); ua.rotation.z = -Math.PI / 2; ua.position.x = 0.24; armIn.add(ua);

  function board(pills) { $("board").innerHTML = pills.map(p => `<span class="pill" style="border-color:${p.color || "var(--line)"}"><small style="color:${p.color || "inherit"}">${p.label}</small>${p.value}</span>`).join(""); }
  function seg(label, id, items, current, onPick) {

  // =====================================================================

  // =====================================================================
  const TRACK_W = 15, HALF = TRACK_W / 2, BARRIER = HALF + 4.5;

      o.appendChild(seg("Car", "carSeg", CARS.map((c, i) => [i, c[0]]), s.car, v => { s.car = v; this.persist(); if (V.bodyMat) V.bodyMat.color.copy(G.lin(CARS[v][1])); this.renderMenu(); }));
      o.appendChild(seg("Gas", "gasSeg", [[true, "Automatic"], [false, "I'll press gas"]], s.autoGas, v => { s.autoGas = v; this.persist(); this.renderMenu(); }));
      $("record").textContent = s.best ? `Best score: ${s.best.toLocaleString()}${s.bestCombo ? ` · Biggest drift: ${s.bestCombo.toLocaleString()}` : ""}` : "";
      $("menuSub").textContent = s.mode === "attack" ? "Slide the car sideways around the corners to score drift points. Keep drifting to build your combo, but don't crash! You have 90 seconds." : "Drive and drift around the track as long as you like.";
      $("help").innerHTML = `<p><b>Keyboard:</b> ◀ ▶ or A/D steer, ▲ or W gas, ▼ or S brake, <b>Space</b> = handbrake (drift!).</p>
        <p><b>iPad:</b> ◀ ▶ buttons on the left, DRIFT and BRAKE on the right${s.autoGas ? " (gas is automatic)" : ", plus GAS"}.</p>
        <p><b>How to drift:</b> turn into a corner and press DRIFT (or Space) to throw the car sideways. Keep steering into the corner to stay sideways, steer the other way to straighten out. The longer the slide, the bigger the points and the multiplier (up to ×5). Hitting a barrier loses the combo. <b>P</b> pause · <b>F</b> full screen</p>`;
    },
    start() {
      t = 0; timeLeft = 90; score = 0; combo = 0; mult = 1; driftT = 0; calmT = 9; comboBest = 0;
      if (V.bodyMat) V.bodyMat.color.copy(G.lin(CARS[this.save.car][1]));
      V.skidN = 0; V.skidGeo.setDrawRange(0, 0); V.lastRear = null; placeCar(); readKeys();
      for (const k in touchHeld) touchHeld[k] = false;
      this.onScreen("play");
    },
    reset() { placeCar(); },
    update(dt) {
      t += dt; readKeys();
      let info = null;
      for (let k = 0; k < 4; k++) info = stepCar(dt / 4);
      const spd = Math.hypot(car.vl, car.vt), beta = Math.atan2(car.vt, Math.max(0.1, Math.abs(car.vl)));
      const drifting = spd > 9 && Math.abs(beta) > 0.2 && Math.abs(beta) < 1.7 && !info.grass && car.vl > 0;
      if (drifting) {
        driftT += dt; calmT = 0;
        combo += dt * spd * Math.abs(beta) * 12;
        mult = Math.min(5, 1 + Math.floor(driftT / 2));
      } else { calmT += dt; if (calmT > 1.1 && combo > 0) bank(); }
      if (car.vl < -2 && Math.abs(beta) > 1.2 && combo > 0) { toast("Spun out!"); combo = 0; mult = 1; driftT = 0; }
      // skid marks and smoke from the rear wheels while sliding
      const fx = Math.sin(car.h), fz = Math.cos(car.h), rx = Math.cos(car.h), rz = -Math.sin(car.h);
      const rear = [-0.88, 0.88].map(x => [car.x + rx * x - fx * 1.35, car.z + rz * x - fz * 1.35]);
      const sliding = (info.drifting || info.slip > 0.16 || input.hand) && spd > 6;
      if (sliding && V.lastRear) { addSkid(V.lastRear[0], V.lastRear[1], rear[0], rear[1]); }
      V.lastRear = sliding ? rear.map(r => [...r]) : null;
      if (sliding) for (const r of rear) if (Math.random() < 0.6) { const s = V.smoke[V.smokeI++ % V.smoke.length]; s.life = 0; s.x = r[0]; s.z = r[1]; s.m.visible = true; }
      // engine and tire sounds
      if (actx && soundOn && Math.random() < dt * 14) tone("sawtooth", 60 + spd * 4.2 + (input.gas || this.save.autoGas ? 15 : 0), 55 + spd * 4, 0.07, 0.025);
      if (sliding && Math.random() < dt * 12) noise("bandpass", 1800, 1200, 0.08, 0.06);
      if (this.save.mode === "attack") { timeLeft -= dt; if (timeLeft <= 0) { timeLeft = 0; bank(); return this.finish(); } }
      const kmh = Math.round(spd * 3.6);
      board(this.save.mode === "attack" ? [{ label: "SCORE", value: score.toLocaleString(), color: "#ff8a1f" }, { label: "TIME", value: Math.ceil(timeLeft) }, { label: "KM/H", value: kmh }]
        : [{ label: "SCORE", value: score.toLocaleString(), color: "#ff8a1f" }, { label: "KM/H", value: kmh }, { label: "BEST", value: this.save.best.toLocaleString() }]);
      const c = $("combo");
      if (combo > 0) { c.textContent = `DRIFT ×${mult}  +${Math.round(combo * mult).toLocaleString()}`; c.style.opacity = 1; c.style.borderColor = ["#fff", "#fff", "#ffd23f", "#ff8a1f", "#ff4f4f", "#c86bff"][mult]; }
      else c.style.opacity = 0;
      if (this.save.mode === "free" && score > this.save.best) { this.save.best = score; }
    },
    finish() {
      const s = this.save, newBest = score > s.best;
      if (newBest) s.best = score; if (comboBest > s.bestCombo) s.bestCombo = comboBest; this.persist();
      gameOver(newBest ? "NEW BEST!" : "TIME'S UP!", [`${score.toLocaleString()} points`, `Biggest drift ${comboBest.toLocaleString()}`], newBest ? "" : `Best: ${s.best.toLocaleString()}`, newBest && score > 0);
    },
    render(dt, st) {
      if (!V.carG) return;
      const { T3 } = G;
      V.carG.position.set(car.x, 0, car.z); V.carG.rotation.y = car.h;
      const roll = clamp(car.vt * 0.012, -0.08, 0.08); V.carG.rotation.z = -roll;
      V.wheels.forEach((w, i) => { w.wg.rotation.x = car.wheelSpin; if (i < 2) w.piv.rotation.y = car.steer; });
      V.tail.forEach(tl => tl.material.color.copy(G.lin(input.brake || input.hand ? 0xff2a2a : 0x7a0d0d)));
      for (const s of V.smoke) { if (s.life > 1.6) { s.m.visible = false; continue; } s.life += dt; const k = s.life / 1.6; s.m.position.set(s.x, 0.4 + k * 1.6, s.z); s.m.scale.setScalar(0.5 + k * 1.8); s.m.material.opacity = 0.32 * (1 - k); }
      // chase camera: behind the car, looking a bit toward where it's sliding
      const fx = Math.sin(car.h), fz = Math.cos(car.h), spd = Math.hypot(car.vl, car.vt);
      let dx = fx, dz = fz;
      if (spd > 4) { const wx = fx * car.vl + Math.cos(car.h) * car.vt, wz = fz * car.vl - Math.sin(car.h) * car.vt, l = Math.hypot(wx, wz); dx = lerp(fx, wx / l, 0.45); dz = lerp(fz, wz / l, 0.45); const l2 = Math.hypot(dx, dz); dx /= l2; dz /= l2; }
      const portrait = innerHeight > innerWidth, back = portrait ? 12 : 9.5, up = portrait ? 5.2 : 4.0;
      if (G.camera.fov !== (portrait ? 70 : 58)) { G.camera.fov = portrait ? 70 : 58; G.camera.updateProjectionMatrix(); }
      V.tmp.set(car.x - dx * back, up, car.z - dz * back);
      V.camPos.lerp(V.tmp, Math.min(1, dt * 5)); V.camLook.lerp(V.tmp.set(car.x + dx * 6, 1.0, car.z + dz * 6), Math.min(1, dt * 8));
      G.camera.position.copy(V.camPos); G.camera.lookAt(V.camLook);
      V.sun.position.set(car.x - 40, 60, car.z - 30); V.sun.target.position.set(car.x, 0, car.z);
    },
  });
  if (DEBUG) window.__dr = { car, input, pts: () => pts, get score() { return score; }, get combo() { return combo; }, get mult() { return mult; }, stepCar, nearest };

  // ---------- flow buttons ----------
  $("playBtn").addEventListener("click", startGame);
  $("againBtn").addEventListener("click", startGame);
  $("resumeBtn").addEventListener("click", resume);
  $("restartBtn").addEventListener("click", () => { state = "play"; GAME.start(); show(null); canvas.focus(); });
  $("quitBtn").addEventListener("click", quit);
  $("menuBtn2").addEventListener("click", quit);
  $("pauseBtn").addEventListener("click", pauseGame);
  $("fsBtn").addEventListener("click", toggleFull); $("fsMenuBtn").addEventListener("click", toggleFull);
  $("helpBtn").addEventListener("click", () => $("help").classList.toggle("hidden"));
  $("soundBtn").addEventListener("click", () => { soundOn = !soundOn; GAME.save.sound = soundOn; GAME.persist(); $("soundBtn").textContent = "Sound: " + (soundOn ? "on" : "off"); });
  addEventListener("resize", () => { if (G) G.resize(); if (GAME.onResize) GAME.onResize(); });
  for (const ev of ["fullscreenchange", "webkitfullscreenchange"]) document.addEventListener(ev, () => { if (G) G.resize(); if (GAME.onResize) GAME.onResize(); });
  document.addEventListener("visibilitychange", () => { if (document.hidden && state === "play") pauseGame(); });
  // ---------- boot + loop ----------
  (async () => {
    const d = await store.get(GAME.saveKey);
    if (d && typeof d === "object") GAME.load(d);
    soundOn = GAME.save.sound !== false;
    $("soundBtn").textContent = "Sound: " + (soundOn ? "on" : "off");
    GAME.renderMenu();
  })();
  if (G) GAME.init();
  GAME.renderMenu();
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
    if (G) {
      if (state === "play") GAME.update(dt);
      GAME.render(dt, state);
      G.renderer.render(G.scene, G.camera);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  if (DEBUG) window.__g = { GAME: () => GAME, state: () => state, keys };
})();
</script>
