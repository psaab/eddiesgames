<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<script>
/* Saving: use the host's storage when it has one (Claude preview); otherwise this browser's own storage. */
(function () {
  try { if (!window.storage && window.parent !== window && window.parent.storage) window.storage = window.parent.storage; } catch (e) {}
  if (!window.storage) {
    window.storage = {
      get: async function (k) { try { var v = localStorage.getItem(k); return v == null ? null : { key: k, value: v }; } catch (e) { return null; } },
      set: async function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} return { key: k, value: v }; }
    };
  }
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Tennis</title>
<style>
  :root {
    --bg: #0c2a22;
    --panel: rgba(8, 30, 24, 0.9);
    --ink: #ffffff;
    --muted: rgba(255, 255, 255, 0.7);
    --p1: #3aa0ff;
    --p2: #ff4f9a;
    --ball: #d7ff3f;
    --line: rgba(255, 255, 255, 0.16);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) { :root { --panel: rgba(8, 30, 24, 0.92); } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: "Avenir Next", "Avenir", "Segoe UI", system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  canvas:focus { outline: none; }
  .hidden { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--ball); outline-offset: 2px; }

  .screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 18px;
    background: radial-gradient(ellipse at center, rgba(12, 42, 34, 0.55), rgba(6, 22, 18, 0.93)); }
  .box { width: min(440px, 100%); display: flex; flex-direction: column; gap: 14px; text-align: center; max-height: 100%; overflow-y: auto; }
  h1 { margin: 0; font-size: clamp(56px, 15vw, 92px); line-height: 0.9; font-weight: 900; font-style: italic; letter-spacing: -2px; color: var(--ball);
    text-shadow: 0 4px 0 #6d8a00; }
  h1 small { display: block; font-size: 0.32em; letter-spacing: 6px; color: var(--ink); text-shadow: none; font-style: normal; margin-top: 4px; }
  .sub { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.45; }
  .seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 4px; gap: 4px; }
  .seg button { flex: 1; border: 0; background: transparent; border-radius: 10px; padding: 11px 6px; font-weight: 800; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #0c2a22; }
  .label { margin: 2px 0 -6px; font-size: 13px; font-weight: 800; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; }
  .big { border: 0; border-radius: 14px; padding: 15px; font-size: 22px; font-weight: 900; font-style: italic; color: #0c2a22;
    background: var(--ball); box-shadow: 0 5px 0 #6d8a00; }
  .big:active { transform: translateY(4px); box-shadow: 0 1px 0 #6d8a00; }
  .ghost { border: 2px solid var(--line); background: var(--panel); border-radius: 12px; padding: 11px; font-weight: 800; font-size: 15px; }
  .row { display: flex; gap: 8px; } .row > * { flex: 1; }
  #record { font-size: 15px; color: var(--muted); }
  #help { background: var(--panel); border-radius: 14px; padding: 12px 14px; font-size: 15px; line-height: 1.5; text-align: left; }
  #help p { margin: 0 0 6px; } #help p:last-child { margin: 0; }
  #help b { color: var(--ball); }
  #winText { font-size: clamp(40px, 10vw, 64px); font-weight: 900; font-style: italic; line-height: 1; }
  #finalScore { font-size: 22px; font-weight: 800; color: var(--muted); }

  #hud { position: fixed; top: max(8px, env(safe-area-inset-top)); right: 8px; display: flex; gap: 6px; }
  #hud button { width: 44px; height: 44px; border: 0; border-radius: 12px; background: var(--panel); font-size: 17px; font-weight: 900; }
  #toast { position: fixed; left: 50%; top: max(12px, env(safe-area-inset-top)); transform: translateX(-50%); background: var(--panel); border: 2px solid var(--ball);
    border-radius: 12px; padding: 9px 14px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity 0.25s; max-width: 92vw; text-align: center; z-index: 5; }
</style>
</head>
<body>
<div id="__ver" aria-label="Tennis version 2.0" style="position:fixed;left:max(6px,env(safe-area-inset-left));bottom:max(4px,env(safe-area-inset-bottom));z-index:99999;pointer-events:none;font:700 11px/1.2 system-ui,-apple-system,sans-serif;color:rgba(255,255,255,0.7);text-shadow:0 1px 2px rgba(0,0,0,0.85);letter-spacing:0.3px">Tennis v2.0</div>
<canvas id="c"></canvas>
<div id="hud" class="hidden"><button id="pauseBtn" aria-label="Pause">II</button><button id="fsBtn" aria-label="Full screen">⛶</button></div>
<div id="toast" role="status" aria-live="polite"></div>

<div id="menu" class="screen">
  <div class="box">
    <h1>TENNIS<small>SMASH</small></h1>
    <p class="sub">Run to the ball and your player swings by themselves. Hit it with the edge of your racket to send it into the corners. First to 7 points, win by 2.</p>
    <div class="label">Players</div>
    <div class="seg" id="modeSeg"><button data-mode="1">1 Player</button><button data-mode="2">2 Players</button></div>
    <div id="diffWrap">
      <div class="label" style="margin-bottom:8px">Computer</div>
      <div class="seg" id="diffSeg"><button data-diff="0">Easy</button><button data-diff="1">Medium</button><button data-diff="2">Hard</button></div>
    </div>
    <div id="record"></div>
    <button class="big" id="playBtn">Play</button>
    <div class="row"><button class="ghost" id="helpBtn">How to play</button><button class="ghost" id="soundBtn">Sound: on</button></div>
    <button class="ghost" id="fsMenuBtn">⛶ Full screen</button>
    <div id="help" class="hidden"></div>
  </div>
</div>

<div id="pause" class="screen hidden">
  <div class="box">
    <h1 style="font-size:52px">PAUSED</h1>
    <button class="big" id="resumeBtn">Resume</button>
    <button class="ghost" id="quitBtn">Quit to menu</button>
  </div>
</div>

<div id="over" class="screen hidden">
  <div class="box">
    <div id="winText"></div>
    <div id="finalScore"></div>
    <div id="overNote" class="sub"></div>
    <button class="big" id="againBtn">Play again</button>
    <button class="ghost" id="menuBtn">Menu</button>
  </div>
</div>

<script>
(() => {
  const isTouch = "ontouchstart" in window || navigator.maxTouchPoints > 0;
  const $ = id => document.getElementById(id);
  const canvas = $("c"), ctx = canvas.getContext("2d");

  // =====================================================================
  // Court (court units). Player 1 is on the y < L/2 side, player 2 / computer on the y > L/2 side.
  // =====================================================================
  const W = 360, L = 1000, NET = L / 2, NET_H = 36, SERVICE = 269;
  const X0 = -130, X1 = W + 130, Y0 = -170, Y1 = L + 170;           // area you can run around in
  const REACH = 62, HIT_H = 80, RUN = 450, G = 620, WIN = 7;
  const COLORS = { p1: "#3aa0ff", p2: "#ff4f9a", ball: "#d7ff3f" };
  const AI = [
    { name: "Easy", speed: 300, react: 3, aimErr: 70, shotT: 1.2, miss: 0.16, wide: 0.2, smart: 0.3, drop: 0.1, tire: 0.08 },
    { name: "Medium", speed: 440, react: 6, aimErr: 36, shotT: 0.88, miss: 0.06, wide: 0.11, smart: 0.7, drop: 0.18, tire: 0.05 },
    { name: "Hard", speed: 560, react: 12, aimErr: 16, shotT: 0.6, miss: 0.02, wide: 0.06, smart: 0.9, drop: 0.28, tire: 0.02 },
  ];

  const save = { mode: 1, diff: 1, sound: true, record: [[0, 0], [0, 0], [0, 0]] };
  function persist() { try { const p = window.storage.set("tennis-save", JSON.stringify(save), false); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
  async function restore() {
    try {
      const r = await window.storage.get("tennis-save", false);
      if (r && r.value) {
        const d = JSON.parse(r.value);
        if (d.mode === 1 || d.mode === 2) save.mode = d.mode;
        if ([0, 1, 2].includes(d.diff)) save.diff = d.diff;
        if (typeof d.sound === "boolean") save.sound = d.sound;
        if (Array.isArray(d.record) && d.record.length === 3) save.record = d.record.map(x => [x[0] | 0, x[1] | 0]);
      }
    } catch (e) {}
    renderMenu();
  }

  // =====================================================================
  // State
  // =====================================================================
  const players = [
    { x: W / 2, y: -40, vx: 0, vy: 0, tx: W / 2, ty: -40, color: COLORS.p1, swing: 9, face: 1 },
    { x: W / 2, y: L + 40, vx: 0, vy: 0, tx: W / 2, ty: L + 40, color: COLORS.p2, swing: 9, face: -1 },
  ];
  const ball = { x: W / 2, y: 0, z: 0, vx: 0, vy: 0, vz: 0, spin: 0, side: 0, rot: 0, live: false, held: true, lastHitter: 0, bounces: 0 };
  const sparks = [], marks = [], bounces = [], trail = [];
  let score = [0, 0], server = 0, serveSide = 1, state = "menu", t = 0, serveAt = 0, pending = null, flash = null, aiErr = 0, rally = 0;

  function placeForServe() {
    const s = players[server], r = players[1 - server];
    const sx = W / 2 + (server === 0 ? serveSide : -serveSide) * 70;
    s.x = s.tx = sx; s.y = s.ty = server === 0 ? -40 : L + 40;
    if (save.mode === 1 && server === 0) { r.tx = W / 2 - serveSide * 60; r.ty = L + 50; }
    ball.held = true; ball.live = false; ball.x = s.x + 18 * s.face; ball.y = s.y; ball.z = 70; ball.vx = ball.vy = ball.vz = 0; ball.spin = ball.side = 0; trail.length = 0;
    serveAt = t + 1.1;
  }
  function startMatch() {
    score = [0, 0]; server = 0; serveSide = 1; pending = null; flash = null; rally = 0;
    marks.length = 0; bounces.length = 0;
    players[0].x = players[0].tx = W / 2; players[0].y = players[0].ty = -40;
    players[1].x = players[1].tx = W / 2; players[1].y = players[1].ty = L + 40;
    placeForServe();
    state = "play"; show(null); $("hud").classList.remove("hidden"); focusGame();
  }

  // =====================================================================
  // Layout: portrait = net across the screen, landscape = net up and down
  // =====================================================================
  let dpr = 1, landscape = false, s = 1, ox = 0, oy = 0;
  const WW = X1 - X0, LL = Y1 - Y0;
  function layout() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
    landscape = innerWidth > innerHeight;
    const pad = 24;
    if (landscape) { s = Math.min((innerWidth - pad) / LL, (innerHeight - pad) / WW); ox = (innerWidth - LL * s) / 2; oy = (innerHeight - WW * s) / 2; }
    else { s = Math.min((innerWidth - pad) / WW, (innerHeight - pad) / LL); ox = (innerWidth - WW * s) / 2; oy = (innerHeight - LL * s) / 2; }
  }
  addEventListener("resize", layout); layout();
  function courtTransform() {
    if (landscape) ctx.setTransform(0, s * dpr, s * dpr, 0, (ox - Y0 * s) * dpr, (oy - X0 * s) * dpr);
    else ctx.setTransform(s * dpr, 0, 0, -s * dpr, (ox - X0 * s) * dpr, (oy + Y1 * s) * dpr);
  }
  const toCourt = (sx, sy) => landscape ? { x: (sy - oy) / s + X0, y: (sx - ox) / s + Y0 } : { x: (sx - ox) / s + X0, y: Y1 - (sy - oy) / s };
  const toScreen = (x, y) => landscape ? { x: ox + (y - Y0) * s, y: oy + (x - X0) * s } : { x: ox + (x - X0) * s, y: oy + (Y1 - y) * s };

  // =====================================================================
  // Input
  // =====================================================================
  const pointers = new Map(), keys = {};
  canvas.addEventListener("pointerdown", e => {
    focusGame();
    if (state !== "play") return;
    const p = toCourt(e.clientX, e.clientY);
    let who = 0;
    if (save.mode === 2) who = p.y < NET ? 0 : 1;
    else if ([...pointers.values()].includes(0)) return;
    pointers.set(e.pointerId, who);
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    if (ball.held && server === who && (save.mode === 2 || who === 0)) serveAt = Math.min(serveAt, t + 0.15);   // tap to serve sooner
    players[who].tx = p.x; players[who].ty = p.y;
  });
  canvas.addEventListener("pointermove", e => {
    let who = pointers.get(e.pointerId);
    if (who === undefined) { if (e.pointerType !== "mouse" || save.mode !== 1 || state !== "play") return; who = 0; }
    const p = toCourt(e.clientX, e.clientY);
    players[who].tx = p.x; players[who].ty = p.y;
  });
  const lift = e => pointers.delete(e.pointerId);
  canvas.addEventListener("pointerup", lift); canvas.addEventListener("pointercancel", lift);
  addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    if (k.startsWith("arrow") || k === " ") e.preventDefault();
    keys[k] = true;
    if (e.repeat) return;
    if (k === "escape" || k === "p") { if (state === "play") pauseGame(); else if (state === "pause") resume(); }
    else if (k === "enter" || k === " ") {
      if (state === "menu" || state === "over") { initAudio(); startMatch(); }
      else if (state === "pause") resume();
      else if (state === "play" && ball.held && (save.mode === 2 || server === 0)) serveAt = Math.min(serveAt, t + 0.1);
    }
    else if (k === "f") toggleFull();
  });
  addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
  addEventListener("blur", () => { for (const k in keys) keys[k] = false; pointers.clear(); if (state === "play") pauseGame(); });
  function keyVector(up, down, left, right) {
    const sx = (keys[right] ? 1 : 0) - (keys[left] ? 1 : 0), sy = (keys[down] ? 1 : 0) - (keys[up] ? 1 : 0);
    if (!sx && !sy) return null;
    return landscape ? { x: sy, y: sx } : { x: sx, y: -sy };
  }

  // =====================================================================
  // Movement: players speed up and slow down (momentum) instead of teleporting
  // =====================================================================
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const ACCEL = 2400;
  function limit(p, who) {
    const ox = p.x, oy = p.y;
    p.x = clamp(p.x, X0 + 20, X1 - 20);
    p.y = who === 0 ? clamp(p.y, Y0 + 20, NET - 26) : clamp(p.y, NET + 26, Y1 - 20);
    if (p.x !== ox) p.vx = 0;
    if (p.y !== oy) p.vy = 0;
  }
  function movePlayer(p, who, dt, speed) {
    if (ball.held && server === who) { p.vx = p.vy = 0; return; }       // stand still while serving
    const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy);
    const want = Math.min(speed, d * 8);                                  // ease in to a stop
    const wx = d > 0.5 ? dx / d * want : 0, wy = d > 0.5 ? dy / d * want : 0;
    const ax = wx - p.vx, ay = wy - p.vy, a = Math.hypot(ax, ay), max = ACCEL * dt;
    if (a > max) { p.vx += ax / a * max; p.vy += ay / a * max; } else { p.vx = wx; p.vy = wy; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    limit(p, who);
  }

  // =====================================================================
  // Ball physics: gravity, air drag, spin (Magnus effect), spin-dependent bounces, net cords.
  // spin > 0 = topspin (dips, kicks forward), spin < 0 = slice/backspin (floats, skids low)
  // side = sidespin (curves left/right)
  // =====================================================================
  const DRAG = 0.00042, MAG_TOP = 300, MAG_SIDE = 240, SMASH_H = 150;
  function stepPhys(b, dt) {
    const vh = Math.hypot(b.vx, b.vy), sp = Math.hypot(vh, b.vz), m = vh / 700;
    const kd = DRAG * sp * dt;
    b.vx -= b.vx * kd; b.vy -= b.vy * kd; b.vz -= b.vz * kd;
    b.vz -= (G + b.spin * MAG_TOP * m) * dt;
    if (vh > 1) { const px = -b.vy / vh, py = b.vx / vh; b.vx += px * b.side * MAG_SIDE * m * dt; b.vy += py * b.side * MAG_SIDE * m * dt; }
    b.spin *= 1 - 0.12 * dt; b.side *= 1 - 0.12 * dt;
    const py0 = b.y;
    b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
    let ev = null;
    if (!b.ghost && (py0 - NET) * (b.y - NET) < 0 && b.x > -30 && b.x < W + 30 && b.z < NET_H + 3) {
      const back = () => { b.y = NET - Math.sign(b.vy) * 3; b.vy *= -0.12; b.vx *= 0.3; b.spin = 0; b.side = 0; };
      if (b.z < NET_H - 5) { back(); ev = "net"; }
      else if (b.cord === false ? false : Math.random() < 0.55) { b.vy *= 0.28; b.vx *= 0.5; b.vz = Math.max(b.vz, 75); b.spin = 0; b.side = 0; ev = "cord"; }
      else { back(); b.vz = Math.max(b.vz, 40); ev = "net"; }
    }
    if (b.z <= 0 && b.vz < 0) {
      b.z = 0;
      const fH = 0.82 + 0.1 * b.spin, fZ = 0.64 + 0.04 * b.spin;      // topspin kicks on, slice stays low and slows
      b.vz = -b.vz * fZ; b.vx *= fH; b.vy *= fH;
      if (vh > 1) { const kx = -b.vy / vh, ky = b.vx / vh; b.vx += kx * b.side * 35; b.vy += ky * b.side * 35; }
      b.spin *= 0.5; b.side *= 0.6;
      if (Math.abs(b.vz) < 30) b.vz = 0;
      ev = ev || "bounce";
    }
    if (b.z <= 0 && b.vz === 0) { const f = 1 - 1.5 * dt; b.vx *= f; b.vy *= f; }   // rolling
    if (b.z < 0) b.z = 0;
    return ev;
  }

  // Fly a pretend ball to see where it lands (and how high it clears the net)
  function simulate(x, y, z, vx, vy, vz, spin, side) {
    const b = { x, y, z, vx, vy, vz, spin, side, ghost: true };
    let tt = 0, netZ = null;
    const dt = 1 / 90;
    for (let i = 0; i < 450; i++) {
      const py = b.y;
      const ev = stepPhys(b, dt); tt += dt;
      if (netZ === null && (py - NET) * (b.y - NET) <= 0 && py !== b.y) netZ = b.z;
      if (ev === "bounce") return { x: b.x, y: b.y, t: tt, netZ };
    }
    return null;
  }

  // Work out how to hit the ball so it lands on (tx, ty) after about T seconds with the given spin,
  // clearing the net by `margin`. Corrects the aim for drag and curve.
  function solveShot(fx, fy, fz, tx, ty, T, spin, side, margin = 12) {
    let ax = tx, ay = ty, best = null;
    for (let pass = 0; pass < 3; pass++) {
      const dx = ax - fx, dy = ay - fy, dist = Math.hypot(dx, dy) || 1, ux = dx / dist, uy = dy / dist;
      const crosses = (fy - NET) * (ay - NET) < 0;
      let H = dist / T * 1.08, sol = null;
      for (let tries = 0; tries < 7 && !sol; tries++) {
        let lo = -300, hi = 1100, res = null;
        for (let it = 0; it < 20; it++) {
          const vz = (lo + hi) / 2, r = simulate(fx, fy, fz, ux * H, uy * H, vz, spin, side);
          const along = r ? (r.x - fx) * ux + (r.y - fy) * uy : Infinity;
          if (along > dist) hi = vz; else lo = vz;
          res = { vz, r };
        }
        if (!res.r) { H *= 0.9; continue; }
        if (crosses && (res.r.netZ === null || res.r.netZ < NET_H + margin)) { H *= 0.88; continue; }
        sol = { vx: ux * H, vy: uy * H, vz: res.vz, land: res.r };
      }
      if (!sol) break;
      best = sol;
      const ex = tx - sol.land.x, ey = ty - sol.land.y;
      if (Math.hypot(ex, ey) < 5) break;
      ax += ex; ay += ey;
    }
    return best;
  }

  function launch(tx, ty, T, hitter, spin = 0.4, side = 0) {
    const sol = solveShot(ball.x, ball.y, ball.z, tx, ty, T, spin, side);
    if (sol) { ball.vx = sol.vx; ball.vy = sol.vy; ball.vz = sol.vz; }
    else {                                                                   // fallback: simple arc
      ball.vx = (tx - ball.x) / T; ball.vy = (ty - ball.y) / T; ball.vz = (0.5 * G * T * T - ball.z) / T + 120;
    }
    ball.spin = spin; ball.side = side;
    ball.lastHitter = hitter; ball.bounces = 0; ball.live = true; ball.held = false;
    predicted = null;
  }

  function serve() {
    const who = server, p = players[who];
    ball.x = p.x + 14 * p.face; ball.y = p.y + 8 * p.face; ball.z = 95;
    const boxX = W / 2 - (who === 0 ? serveSide : -serveSide) * (W * 0.24) + (Math.random() - 0.5) * 50;
    const ty = who === 0 ? NET + SERVICE * (0.55 + Math.random() * 0.3) : NET - SERVICE * (0.55 + Math.random() * 0.3);
    launch(boxX, ty, 0.9, who, 0.6, 0);                                     // kick serve with topspin
    p.swing = 0; hitSound(0.8);
    rally = 0;
  }

  // Shot types come from how you're moving when you hit
  const SHOTS = {
    rally:  { depth: 330, T: 1.0,  spin: 0.5,  wobble: 50 },
    drive:  { depth: 385, T: 0.78, spin: 1.0,  wobble: 60 },   // running at the net: heavy topspin
    lob:    { depth: 410, T: 1.65, spin: 0.3,  wobble: 50 },   // backing away: high and deep
    slice:  { depth: 300, T: 1.15, spin: -0.9, wobble: 45 },   // standing still: floaty backspin
    volley: { depth: 230, T: 0.85, spin: -0.4, wobble: 40 },   // before it bounces: short and angled
    smash:  { depth: 330, T: 0.5,  spin: 0.2,  wobble: 70 },   // ball up high: slam it down
    drop:   { depth: 150, T: 1.1,  spin: -1.0, wobble: 30 },   // computer's touch shot
  };

  function tryHit(who) {
    const p = players[who];
    if (!ball.live || ball.lastHitter === who || ball.lastHitter === -1 || ball.z > SMASH_H) return;
    if ((who === 0) !== (ball.y < NET)) return;
    const dx = ball.x - p.x, dy = ball.y - p.y;
    if (Math.hypot(dx, dy) > REACH) return;
    const isAI = who === 1 && save.mode === 1;
    if (isAI && Math.random() < AI[save.diff].miss * (1 + rally * AI[save.diff].tire)) { ball.lastHitter = -1; return; }   // fluffs it
    const off = clamp(dx / REACH, -1, 1), toward = who === 0 ? 1 : -1;
    const fwd = (p.vy * toward) / RUN, speed = Math.hypot(p.vx, p.vy);
    let kind;
    if (ball.z > HIT_H) kind = "smash";
    else if (ball.bounces === 0) kind = "volley";
    else if (isAI) { const r = Math.random(), lv = AI[save.diff]; kind = r < lv.drop ? "drop" : r < lv.drop + 0.25 ? "drive" : r < lv.drop + 0.4 ? "slice" : r < lv.drop + 0.47 ? "lob" : "rally"; }
    else if (fwd > 0.35) kind = "drive";
    else if (fwd < -0.35) kind = "lob";
    else if (speed < RUN * 0.15) kind = "slice";
    else kind = "rally";
    const shot = SHOTS[kind];
    // Sweet spot: hitting with the middle of the racket at a comfy height is the most accurate
    const heightOk = ball.z >= 15 && ball.z <= 65;
    const quality = (1 - Math.max(0, Math.abs(off) - 0.6) * 1.2) * (heightOk || kind === "smash" || kind === "volley" ? 1 : 0.75);
    let tx, ty, T = shot.T * (1 - Math.min(0.12, rally * 0.01));
    if (isAI) {
      const lv = AI[save.diff], pick = Math.random();
      const away = players[0].x < W / 2 ? W * (1 - lv.wide) : W * lv.wide;
      tx = (Math.random() < lv.smart ? away : pick < 0.4 ? W * lv.wide : pick < 0.8 ? W * (1 - lv.wide) : W / 2) + aiErr;
      ty = NET + toward * (shot.depth + (Math.random() - 0.5) * 80);
      T *= lv.shotT;
      aiErr = (Math.random() - 0.5) * 2 * lv.aimErr;
    } else {
      // Where on the racket it hits picks the direction (edges go wide, and can go out)
      tx = clamp(W / 2 + off * W * (kind === "volley" ? 0.72 : 0.62) + p.vx * 0.08, -60, W + 60);
      ty = NET + toward * (shot.depth + (Math.random() - 0.5) * 50);
    }
    const wob = shot.wobble * (1.2 - quality);
    tx += (Math.random() - 0.5) * wob; ty += (Math.random() - 0.5) * wob;
    launch(tx, ty, T, who, shot.spin, -off * 0.6 * toward);
    p.swing = 0; rally++;
    lastShot = kind;
    hitSound(Math.min(1, Math.hypot(ball.vx, ball.vy) / 1300), kind);
    burst(ball.x, ball.y, p.color, kind === "smash" ? 16 : 8);
  }

  function pointTo(who, reason, x, y) {
    if (!ball.live) return;
    ball.live = false;
    score[who]++;
    flash = { who, at: t };
    if (reason === "out" && x !== undefined) marks.push({ x, y, at: t });
    pointSound(who === 0 || save.mode === 2);
    const won = score[who] >= WIN && score[who] - score[1 - who] >= 2;
    if (won) { pending = { at: t + 1.4, kind: "over", who }; return; }
    serveSide = -serveSide;
    if ((score[0] + score[1]) % 2 === 1) server = 1 - server;
    pending = { at: t + 1.3, kind: "serve" };
  }

  function updateBall(dt) {
    if (ball.held) {
      const p = players[server];
      ball.x = p.x + 18 * p.face; ball.y = p.y; ball.z = 70 + Math.sin(t * 6) * 4;
      return;
    }
    const ev = stepPhys(ball, dt);
    ball.rot = (ball.rot || 0) + (ball.spin * 25 + 4) * dt;
    if (ev === "net") netSound();
    if (ev === "cord") { netSound(); tone("triangle", 900, 600, 0.08, 0.06); }
    if (ev === "bounce") {
      if (ball.live) {
        const side = ball.y < NET ? 0 : 1;
        const inside = ball.x >= -4 && ball.x <= W + 4 && ball.y >= -4 && ball.y <= L + 4;
        if (ball.bounces === 0) {
          if (ball.lastHitter === -1) pointTo(side === 0 ? 1 : 0, "miss");                        // computer whiffed
          else if (side === ball.lastHitter) pointTo(1 - ball.lastHitter, "net");
          else if (!inside) pointTo(1 - ball.lastHitter, "out", ball.x, ball.y);
          else { ball.bounces = 1; bounceSound(); bounces.push({ x: ball.x, y: ball.y, at: t }); predicted = null; }
        } else pointTo(side === 0 ? 1 : 0, "twice");
      } else bounceSound(0.4);
    }
  }

  // Where can `who` reach the ball? Fly a pretend ball forward and find the first good hitting spot.
  function predictHit(who, speed) {
    const p = players[who];
    const b = { x: ball.x, y: ball.y, z: ball.z, vx: ball.vx, vy: ball.vy, vz: ball.vz, spin: ball.spin, side: ball.side, cord: false };
    let bounced = ball.bounces, tt = 0, fallback = null;
    const dt = 1 / 60, mySide = y => (who === 0) === (y < NET);
    for (let i = 0; i < 180; i++) {
      const ev = stepPhys(b, dt); tt += dt;
      if (ev === "net") return null;
      if (ev === "bounce") { if (bounced >= 1) break; bounced++; }
      if (!mySide(b.y) || b.z > HIT_H * 0.95) continue;
      const good = bounced === 1 ? b.z >= 12 : Math.abs(b.y - NET) < 140;
      if (!good) continue;
      const need = Math.max(0, Math.hypot(b.x - p.x, b.y - p.y) - REACH * 0.55);
      const cand = { x: b.x, y: b.y, t: tt };
      fallback = cand;
      if (need <= speed * tt * 0.8) return cand;
    }
    return fallback;
  }

  let predicted = null, predictAt = 0, lastShot = "";
  function updateAI(dt) {
    const p = players[1], lv = AI[save.diff];
    let tx, ty;
    if (ball.held) {
      if (server === 1) { tx = p.x; ty = p.y; } else { tx = W / 2 - serveSide * 60; ty = L + 50; }
    } else if (ball.live && ball.lastHitter === 0) {
      if (!predicted || t > predictAt) { predicted = predictHit(1, lv.speed) || predicted; predictAt = t + 0.12; }
      if (predicted) { tx = predicted.x + aiErr * 0.4; ty = predicted.y + 22; }
      else { tx = W / 2 + (ball.x - W / 2) * 0.25; ty = L + 40; }
    } else {
      tx = W / 2 + (ball.x - W / 2) * 0.25; ty = L + 40;
    }
    const k = Math.min(1, dt * lv.react);
    p.tx += (tx - p.tx) * k; p.ty += (ty - p.ty) * k;
    movePlayer(p, 1, dt, lv.speed);
  }

  function update(dt) {
    if (state !== "play") return;
    t += dt;
    if (pending && t >= pending.at) {
      const pd = pending; pending = null;
      if (pd.kind === "serve") placeForServe(); else { gameOver(pd.who); return; }
    }
    const kv1 = keyVector("w", "s", "a", "d") || (save.mode === 1 ? keyVector("arrowup", "arrowdown", "arrowleft", "arrowright") : null);
    if (kv1) { players[0].tx = players[0].x + kv1.x * 50; players[0].ty = players[0].y + kv1.y * 50; }
    if (save.mode === 2) {
      const kv2 = keyVector("arrowup", "arrowdown", "arrowleft", "arrowright");
      if (kv2) { players[1].tx = players[1].x + kv2.x * 50; players[1].ty = players[1].y + kv2.y * 50; }
    }
    const steps = 4, h = dt / steps;
    for (let i = 0; i < steps; i++) {
      movePlayer(players[0], 0, h, RUN);
      if (save.mode === 2) movePlayer(players[1], 1, h, RUN); else updateAI(h);
      updateBall(h);
      tryHit(0); tryHit(1);
    }
    if (ball.held && !pending && t >= serveAt) serve();
    for (const p of players) p.swing += dt;
  }

  function gameOver(winner) {
    if (state !== "play") return;
    state = "over"; $("hud").classList.add("hidden"); pointers.clear();
    const two = save.mode === 2;
    $("winText").textContent = two ? (winner === 0 ? "BLUE WINS!" : "PINK WINS!") : (winner === 0 ? "YOU WIN!" : "COMPUTER WINS");
    $("winText").style.color = winner === 0 ? COLORS.p1 : COLORS.p2;
    $("finalScore").textContent = score[0] + " – " + score[1];
    if (!two) {
      save.record[save.diff][winner === 0 ? 0 : 1]++; persist();
      const r = save.record[save.diff];
      $("overNote").textContent = AI[save.diff].name + " record: " + r[0] + " wins, " + r[1] + " losses" + (winner === 0 && save.diff < 2 ? ". Ready for " + AI[save.diff + 1].name + "?" : "");
    } else $("overNote").textContent = "";
    show("over");
    if (winner === 0 || two) cheer();
  }

  // =====================================================================
  // Drawing
  // =====================================================================
  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = 80 + Math.random() * 260;
      sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0, max: 0.2 + Math.random() * 0.25, color });
    }
  }
  function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
  function drawCourt() {
    courtTransform();
    ctx.fillStyle = "#2f7d63"; ctx.fillRect(X0, Y0, WW, LL);
    ctx.fillStyle = "#2a6fb8"; ctx.fillRect(-40, -60, W + 80, L + 120);
    ctx.fillStyle = "rgba(255,255,255,0.035)";
    for (let y = -60; y < L + 60; y += 40) ctx.fillRect(-40, y, W + 80, 20);
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 5;
    ctx.strokeRect(0, 0, W, L);
    line(0, NET - SERVICE, W, NET - SERVICE); line(0, NET + SERVICE, W, NET + SERVICE);
    line(W / 2, NET - SERVICE, W / 2, NET + SERVICE);
    line(W / 2, 0, W / 2, 14); line(W / 2, L, W / 2, L - 14);
    // Out marks where a ball landed out
    for (const m of bounces) {
      const a = Math.max(0, 1 - (t - m.at) / 1.4); if (!a) continue;
      ctx.fillStyle = `rgba(255,255,255,${0.45 * a})`; ctx.beginPath(); ctx.ellipse(m.x, m.y, 7, 4, 0, 0, 7); ctx.fill();
    }
    for (const m of marks) {
      const a = Math.max(0, 1 - (t - m.at) / 2.5); if (!a) continue;
      ctx.strokeStyle = `rgba(255,80,80,${a})`; ctx.lineWidth = 6;
      line(m.x - 12, m.y - 12, m.x + 12, m.y + 12); line(m.x - 12, m.y + 12, m.x + 12, m.y - 12);
    }
  }
  function drawNet() {
    courtTransform();
    ctx.fillStyle = "rgba(0,0,0,0.22)"; ctx.fillRect(-36, NET - 2, W + 72, 12);
    ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.lineWidth = 1.5;
    for (let x = -34; x <= W + 34; x += 8) line(x, NET - 6, x, NET + 6);
    ctx.fillStyle = "#f4f4f4"; ctx.fillRect(-36, NET - 3, W + 72, 6);
    ctx.fillStyle = "#1c2230"; ctx.beginPath(); ctx.arc(-38, NET, 7, 0, 7); ctx.arc(W + 38, NET, 7, 0, 7); ctx.fill();
  }
  function drawPlayer(p) {
    courtTransform();
    const f = p.face, sw = p.swing < 0.28 ? Math.sin(p.swing / 0.28 * Math.PI) : 0;
    ctx.fillStyle = "rgba(0,0,0,0.25)"; ctx.beginPath(); ctx.ellipse(p.x + 4, p.y - 4 * f, 24, 20, 0, 0, 7); ctx.fill();
    // racket swings around the shoulder
    const ang = (f > 0 ? 0.35 : Math.PI - 0.35) - f * sw * 1.6;
    const hx = p.x + Math.cos(ang) * 26, hy = p.y + Math.sin(ang) * 26;
    const rx = p.x + Math.cos(ang) * 48, ry = p.y + Math.sin(ang) * 48;
    ctx.strokeStyle = "#20242e"; ctx.lineWidth = 5; line(hx, hy, p.x + Math.cos(ang) * 38, p.y + Math.sin(ang) * 38);
    ctx.save(); ctx.translate(rx, ry); ctx.rotate(ang);
    ctx.fillStyle = "rgba(255,255,255,0.25)"; ctx.strokeStyle = p.color; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(0, 0, 13, 10, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.restore();
    // body + head
    ctx.fillStyle = p.color; ctx.beginPath(); ctx.ellipse(p.x, p.y, 22, 15, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#e0ac69"; ctx.beginPath(); ctx.arc(p.x, p.y, 10, 0, 7); ctx.fill();
    ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(p.x, p.y + 2 * f, 10.5, Math.PI * (f > 0 ? 0 : 1), Math.PI * (f > 0 ? 1 : 2)); ctx.fill();
  }
  function drawBall() {
    courtTransform();
    const shR = Math.max(4, 8 - ball.z * 0.03);
    ctx.fillStyle = `rgba(0,0,0,${Math.max(0.12, 0.35 - ball.z * 0.002)})`; ctx.beginPath(); ctx.arc(ball.x, ball.y, shR, 0, 7); ctx.fill();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const sp = toScreen(ball.x, ball.y), r = (9 + ball.z * 0.045) * s;
    const by = sp.y - ball.z * s * 0.55;
    // trail: orange for topspin, blue for slice
    if (!ball.held) {
      trail.push({ x: sp.x, y: by, r }); if (trail.length > 10) trail.shift();
      const col = ball.spin > 0.15 ? "255,150,60" : ball.spin < -0.15 ? "90,170,255" : "255,255,255";
      trail.forEach((p, i) => { ctx.fillStyle = `rgba(${col},${(i / trail.length) * 0.35})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.4 + 0.6 * i / trail.length), 0, 7); ctx.fill(); });
    }
    ctx.save(); ctx.shadowColor = COLORS.ball; ctx.shadowBlur = 10;
    ctx.fillStyle = COLORS.ball; ctx.beginPath(); ctx.arc(sp.x, by, r, 0, 7); ctx.fill(); ctx.restore();
    // the seam spins with the ball
    ctx.save(); ctx.translate(sp.x, by); ctx.rotate(ball.rot || 0);
    ctx.strokeStyle = "rgba(255,255,255,0.85)"; ctx.lineWidth = Math.max(1, r * 0.18);
    ctx.beginPath(); ctx.arc(-r * 0.9, 0, r * 0.75, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(r * 0.9, 0, r * 0.75, Math.PI - 0.9, Math.PI + 0.9); ctx.stroke();
    ctx.restore();
  }
  function drawScores() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const size = Math.min(W, L / 2) * s * 0.55;
    for (const who of [0, 1]) {
      const c = toScreen(W / 2, who === 0 ? NET - 250 : NET + 250);
      ctx.save(); ctx.globalAlpha = 0.16; ctx.fillStyle = who === 0 ? COLORS.p1 : COLORS.p2;
      ctx.font = `italic 900 ${size}px Avenir Next, Segoe UI, system-ui, sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(String(score[who]), c.x, c.y); ctx.restore();
    }
  }
  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#0c2a22"; ctx.fillRect(0, 0, innerWidth, innerHeight);
    drawCourt();
    drawScores();
    drawNet();
    drawPlayer(players[landscape ? 0 : 1]); drawPlayer(players[landscape ? 1 : 0]);
    drawBall();
    courtTransform();
    for (const sp of sparks) { ctx.globalAlpha = Math.max(0, 1 - sp.life / sp.max); ctx.fillStyle = sp.color; ctx.fillRect(sp.x - 3, sp.y - 3, 6, 6); }
    ctx.globalAlpha = 1;
    if (flash && t - flash.at < 0.9) {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = flash.who === 0 ? COLORS.p1 : COLORS.p2; ctx.globalAlpha = (1 - (t - flash.at) / 0.9) * 0.16;
      ctx.fillRect(0, 0, innerWidth, innerHeight); ctx.globalAlpha = 1;
    }
  }

  // =====================================================================
  // Sound
  // =====================================================================
  let actx = null, noiseBuf = null;
  function initAudio() {
    if (actx) { if (actx.state === "suspended") actx.resume(); return; }
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { actx = null; }
  }
  function tone(type, f0, f1, dur, vol, delay = 0) {
    if (!actx || !save.sound) return;
    const st = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, st); o.frequency.exponentialRampToValueAtTime(f1, st + dur);
    g.gain.setValueAtTime(vol, st); g.gain.exponentialRampToValueAtTime(0.001, st + dur);
    o.connect(g); g.connect(actx.destination); o.start(st); o.stop(st + dur + 0.03);
  }
  function noise(type, f0, f1, dur, vol, delay = 0) {
    if (!actx || !save.sound) return;
    const st = actx.currentTime + delay, src = actx.createBufferSource(); src.buffer = noiseBuf;
    const f = actx.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(f0, st); f.frequency.exponentialRampToValueAtTime(f1, st + dur);
    const g = actx.createGain(); g.gain.setValueAtTime(vol, st); g.gain.exponentialRampToValueAtTime(0.001, st + dur);
    src.connect(f); f.connect(g); g.connect(actx.destination); src.start(st, Math.random() * 0.5); src.stop(st + dur + 0.03);
  }
  const hitSound = (k, kind) => {
    tone("sine", 420 + k * 260, 180, 0.08, 0.28); noise("bandpass", 2400, 1200, 0.05, 0.25);
    if (kind === "smash") { noise("lowpass", 1800, 200, 0.18, 0.35); tone("square", 220, 90, 0.12, 0.08); }
    else if (kind === "slice" || kind === "drop") tone("sine", 700, 500, 0.05, 0.08);
  };
  const bounceSound = (v = 1) => tone("sine", 230, 110, 0.07, 0.14 * v);
  const netSound = () => { noise("lowpass", 600, 120, 0.25, 0.3); };
  function pointSound(good) { tone("triangle", good ? 660 : 330, good ? 990 : 220, 0.25, 0.12); if (good) tone("triangle", 990, 1320, 0.2, 0.08, 0.1); }
  function cheer() { for (let i = 0; i < 16; i++) noise("bandpass", 900 + Math.random() * 1500, 700, 0.6 + Math.random() * 0.6, 0.06, Math.random() * 0.5); }

  // =====================================================================
  // Menus
  // =====================================================================
  function show(id) { for (const s2 of ["menu", "pause", "over"]) $(s2).classList.toggle("hidden", s2 !== id); }
  function renderMenu() {
    for (const b of $("modeSeg").children) b.setAttribute("aria-pressed", Number(b.dataset.mode) === save.mode);
    for (const b of $("diffSeg").children) b.setAttribute("aria-pressed", Number(b.dataset.diff) === save.diff);
    $("diffWrap").classList.toggle("hidden", save.mode !== 1);
    const r = save.record[save.diff];
    $("record").textContent = save.mode === 1 ? (r[0] + r[1] ? `Your ${AI[save.diff].name} record: ${r[0]} wins, ${r[1]} losses` : "")
      : "Hand the iPad to a friend: Blue plays from the near side, Pink from the far side.";
    $("soundBtn").textContent = "Sound: " + (save.sound ? "on" : "off");
  }
  for (const b of $("modeSeg").children) b.addEventListener("click", () => { save.mode = Number(b.dataset.mode); persist(); renderMenu(); });
  for (const b of $("diffSeg").children) b.addEventListener("click", () => { save.diff = Number(b.dataset.diff); persist(); renderMenu(); });
  $("help").innerHTML = `<p><b>Move</b> your player and they swing on their own when the ball comes close.</p>
    <p><b>Aim:</b> hit the ball with the middle of the racket to go straight, the edges to angle it into the corners (too far and it goes out). Run toward the net as you hit to smash it harder.</p>
    <p><b>Touch:</b> drag on your side of the court. <b>Mouse:</b> move it. <b>Keyboard:</b> WASD or arrows (2 Players: Blue WASD, Pink arrows). Tap or press Space to serve sooner.</p>
    <p>You win a point if the other player misses, hits into the net, or hits it out. <b>P</b> pause · <b>F</b> full screen</p>`;
  $("helpBtn").addEventListener("click", () => $("help").classList.toggle("hidden"));
  $("soundBtn").addEventListener("click", () => { save.sound = !save.sound; persist(); renderMenu(); });
  $("playBtn").addEventListener("click", () => { initAudio(); startMatch(); });
  $("againBtn").addEventListener("click", () => { initAudio(); startMatch(); });
  $("menuBtn").addEventListener("click", toMenu);
  $("quitBtn").addEventListener("click", toMenu);
  $("resumeBtn").addEventListener("click", resume);
  $("pauseBtn").addEventListener("click", pauseGame);
  function toMenu() { state = "menu"; $("hud").classList.add("hidden"); renderMenu(); show("menu"); }
  function pauseGame() { if (state !== "play") return; state = "pause"; pointers.clear(); show("pause"); }
  function resume() { if (state !== "pause") return; state = "play"; show(null); focusGame(); }
  function focusGame() { try { window.focus(); canvas.tabIndex = 0; canvas.focus({ preventScroll: true }); } catch (e) {} }

  const root = document.documentElement;
  let toastTimer;
  function toast(msg) { const el = $("toast"); el.textContent = msg; el.style.opacity = 1; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.style.opacity = 0, 4500); }
  async function toggleFull() {
    try {
      if (document.fullscreenElement || document.webkitFullscreenElement) await (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else if (root.requestFullscreen && document.fullscreenEnabled !== false) await root.requestFullscreen({ navigationUI: "hide" });
      else if (root.webkitRequestFullscreen) root.webkitRequestFullscreen();
      else throw 0;
    } catch (e) { toast("This window didn't allow full screen. Try opening the game in its own browser tab."); }
  }
  $("fsBtn").addEventListener("click", toggleFull);
  $("fsMenuBtn").addEventListener("click", toggleFull);
  for (const ev of ["fullscreenchange", "webkitfullscreenchange"]) document.addEventListener(ev, layout);

  // =====================================================================
  // Loop
  // =====================================================================
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
    update(dt);
    for (let i = sparks.length - 1; i >= 0; i--) {
      const sp = sparks[i]; sp.life += dt; sp.x += sp.vx * dt; sp.y += sp.vy * dt; sp.vx *= 0.9; sp.vy *= 0.9;
      if (sp.life > sp.max) sparks.splice(i, 1);
    }
    draw();
    requestAnimationFrame(frame);
  }
  renderMenu();
  restore();
  placeForServe();
  requestAnimationFrame(frame);
