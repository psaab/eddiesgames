<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<script>
/* Saving: use the host's storage when it has one (Claude preview); otherwise this browser's own storage. */
(function () {
  try { if (!window.storage && window.parent !== window && window.parent.storage) window.storage = window.parent.storage; } catch (e) {}
  if (!window.storage) {
    window.storage = {
      get: async function (k) { try { var v = localStorage.getItem(k); return v == null ? null : { key: k, value: v }; } catch (e) { return null; } },
      set: async function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} return { key: k, value: v }; }
    };
  }
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cliff Dive</title>
<style>
  :root {
    --sea: #0b5d6b;
    --sea-deep: #073e49;
    --surf: #1aa3b8;
    --sand: #f4d58d;
    --coral: #ff5a4e;
    --ink: #ffffff;
    --muted: rgba(255, 255, 255, 0.72);
    --panel: rgba(7, 62, 73, 0.82);
    --panel-solid: #073e49;
    --line: rgba(255, 255, 255, 0.18);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --panel: rgba(3, 30, 36, 0.88);
      --panel-solid: #04262d;
      --muted: rgba(255, 255, 255, 0.68);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sea-deep); color: var(--ink);
    font-family: "Avenir Next Condensed", "Avenir Next", "Arial Narrow", "Helvetica Neue", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  canvas:focus { outline: none; }
  .hidden { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--sand); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- Menu: the cliff ladder ---------- */
  #menu { position: fixed; inset: 0; display: flex; align-items: center; padding: 24px max(24px, env(safe-area-inset-left));
    background: linear-gradient(90deg, rgba(4, 38, 45, 0.86) 0%, rgba(4, 38, 45, 0.55) 46%, rgba(4, 38, 45, 0) 75%); }
  .menuInner { width: min(430px, 100%); display: flex; flex-direction: column; gap: 16px; max-height: 100%; overflow-y: auto; }
  .title { margin: 0; font-size: clamp(54px, 13vw, 96px); font-weight: 900; line-height: 0.86; letter-spacing: -2px; font-style: italic; }
  .title span { display: block; color: var(--sand); }
  .tag { margin: 0; color: var(--muted); font-size: 17px; line-height: 1.4; max-width: 32ch; }
  #ladder { display: flex; flex-direction: column; gap: 6px; position: relative; padding-left: 18px; }
  #ladder::before { content: ""; position: absolute; left: 5px; top: 10px; bottom: 10px; width: 3px; border-radius: 2px;
    background: linear-gradient(180deg, var(--sand), var(--surf)); }
  .rung { position: relative; display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 10px; text-align: left;
    background: var(--panel); border: 2px solid transparent; border-radius: 12px; padding: 9px 12px; }
  .rung::before { content: ""; position: absolute; left: -18px; top: 50%; width: 13px; height: 13px; margin-top: -6.5px; border-radius: 50%;
    background: var(--panel-solid); border: 3px solid var(--surf); }
  .rung .h { font-size: 26px; font-weight: 900; font-style: italic; }
  .rung .h small { font-size: 14px; font-weight: 700; }
  .rung .n { font-size: 16px; font-weight: 700; }
  .rung .b { font-size: 13px; color: var(--muted); text-align: right; }
  .rung[aria-pressed="true"] { border-color: var(--sand); }
  .rung[aria-pressed="true"]::before { background: var(--sand); border-color: var(--sand); }
  .rung:disabled { opacity: 0.5; cursor: default; }
  .big { border: 0; border-radius: 14px; padding: 15px 22px; font-size: 24px; font-weight: 900; font-style: italic; letter-spacing: 0.5px;
    background: var(--coral); color: #fff; box-shadow: 0 5px 0 #a8302a; }
  .big:active { transform: translateY(4px); box-shadow: 0 1px 0 #a8302a; }
  .row { display: flex; gap: 8px; }
  .ghost { flex: 1; border: 2px solid var(--line); background: var(--panel); border-radius: 12px; padding: 10px; font-weight: 800; font-size: 15px; }
  #help { background: var(--panel); border-radius: 14px; padding: 12px 14px; font-size: 15px; line-height: 1.5; }
  #help b { color: var(--sand); }
  #help p { margin: 0 0 6px; }
  #help p:last-child { margin: 0; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #where { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 10px; background: var(--panel); border-radius: 12px; padding: 7px 12px; }
  #where b { display: block; font-size: 20px; font-style: italic; }
  #where span { font-size: 13px; color: var(--muted); }
  #menuBtn { pointer-events: auto; position: fixed; top: max(10px, env(safe-area-inset-top)); right: 10px; border: 0; border-radius: 12px;
    background: var(--panel); padding: 10px 14px; font-weight: 800; }
  #spin { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); text-align: center;
    text-shadow: 0 2px 6px rgba(0,0,0,0.45); }
  #spin b { display: block; font-size: clamp(30px, 6vw, 46px); font-weight: 900; font-style: italic; line-height: 1; }
  #spin span { font-size: 14px; font-weight: 700; color: var(--muted); }
  #alt { position: fixed; right: 16px; top: 22%; bottom: 30%; width: 10px; border-radius: 5px; background: rgba(255,255,255,0.2); }
  #altFill { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 5px; background: var(--sand); }
  #altLabel { position: absolute; right: 16px; transform: translateY(50%); font-size: 15px; font-weight: 900; font-style: italic; white-space: nowrap;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
  #callout { position: fixed; left: 50%; top: 36%; transform: translate(-50%, -50%); font-size: clamp(30px, 8vw, 60px); font-weight: 900;
    font-style: italic; color: var(--sand); text-shadow: 0 3px 0 rgba(0,0,0,0.35); opacity: 0; transition: opacity 0.25s; white-space: nowrap; }
  #hint { position: fixed; left: 50%; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 120px); transform: translateX(-50%);
    background: var(--panel); border-radius: 12px; padding: 8px 14px; font-size: 16px; font-weight: 700; text-align: center; max-width: 92vw; }

  /* ---------- Touch buttons ---------- */
  .pad { pointer-events: auto; position: fixed; border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; background: var(--panel);
    display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 15px; touch-action: none; text-align: center; line-height: 1.1; }
  .pad.on { background: var(--sand); color: #3a2a00; border-color: var(--sand); }
  #diveBtn { pointer-events: auto; position: fixed; left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    width: min(320px, 80vw); }
  #pTuck { right: 18px; bottom: 40px; width: 112px; height: 112px; font-size: 20px; background: rgba(255, 90, 78, 0.85); border-color: rgba(255,255,255,0.6); }
  #trail { position: fixed; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; pointer-events: none;
    border: 3px solid rgba(255,255,255,0.75); background: rgba(255,255,255,0.15); opacity: 0; transition: opacity 0.2s; }

  /* ---------- Scorecard ---------- */
  #score { position: fixed; left: 0; right: 0; bottom: max(16px, env(safe-area-inset-bottom)); display: flex; justify-content: center; padding: 0 12px; }
  .card { width: min(640px, 100%); background: var(--panel-solid); border-radius: 18px; overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,0.35); }
  .cardTop { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding: 14px 16px 10px;
    background: linear-gradient(90deg, var(--sea), var(--surf)); }
  #dName { font-size: 20px; font-weight: 900; font-style: italic; line-height: 1.15; }
  #dSub { font-size: 14px; color: var(--muted); margin-top: 2px; }
  #dd { text-align: right; flex: none; }
  #dd b { display: block; font-size: 28px; font-weight: 900; font-style: italic; line-height: 1; }
  #dd span { font-size: 12px; color: var(--muted); }
  #judges { display: grid; grid-template-columns: repeat(3, 1fr) 1.3fr; }
  .judge { padding: 12px 8px; text-align: center; border-right: 1px solid var(--line); opacity: 0; transform: translateY(10px);
    transition: opacity 0.3s, transform 0.3s; }
  .judge.in { opacity: 1; transform: none; }
  .judge small { display: block; font-size: 12px; color: var(--muted); }
  .judge b { font-size: 34px; font-weight: 900; font-style: italic; }
  .judge.total b { color: var(--sand); font-size: 40px; }
  #verdict { padding: 0 16px 6px; font-size: 16px; font-weight: 800; min-height: 1.4em; color: var(--sand); }
  .cardBtns { display: flex; gap: 8px; padding: 6px 12px 12px; }
  .cardBtns .big { flex: 1.4; font-size: 20px; padding: 12px; }
  .cardBtns .ghost { flex: 1; }

  #fade { position: fixed; inset: 0; background: radial-gradient(ellipse at center, rgba(26, 163, 184, 0.35), rgba(4, 38, 45, 0.85)); opacity: 0; pointer-events: none; transition: opacity 0.4s; }
  @media (prefers-reduced-motion: reduce) { .judge, #callout, #fade { transition: none; } }
  .fsBtn { flex: none; width: 100%; }
  #fsHudBtn { pointer-events: auto; position: fixed; top: max(10px, env(safe-area-inset-top)); right: 92px; width: 44px; height: 42px;
    border: 0; border-radius: 12px; background: var(--panel); font-size: 20px; line-height: 1; }
  #toast { position: fixed; left: 50%; top: max(14px, env(safe-area-inset-top)); transform: translateX(-50%); z-index: 10; max-width: min(460px, 92vw);
    background: var(--panel-solid); border: 2px solid var(--sand); border-radius: 14px; padding: 10px 14px; font-size: 16px; font-weight: 700;
    line-height: 1.35; text-align: center; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
</style>
</head>
<body>
<div id="__ver" aria-label="Cliff Dive version 1.2" style="position:fixed;left:max(6px,env(safe-area-inset-left));bottom:max(4px,env(safe-area-inset-bottom));z-index:99999;pointer-events:none;font:700 11px/1.2 system-ui,-apple-system,sans-serif;color:rgba(255,255,255,0.7);text-shadow:0 1px 2px rgba(0,0,0,0.85);letter-spacing:0.3px">Cliff Dive v1.2</div>
<canvas id="c"></canvas>
<div id="fade"></div>
<div id="toast" role="status" aria-live="polite"></div>

<!-- Menu -->
<div id="menu">
  <div class="menuInner">
    <h1 class="title">Cliff<span>Dive</span></h1>
    <p class="tag">Run off the edge, flip and twist on the way down, then straighten out before you hit the water.</p>
    <div id="ladder" aria-label="Choose a cliff"></div>
    <button class="big" id="goBtn">Climb up</button>
    <div class="row">
      <button class="ghost" id="helpBtn">How to dive</button>
      <button class="ghost" id="soundBtn">Sound: on</button>
    </div>
    <button class="ghost fsBtn" id="fsMenuBtn">⛶ Full screen</button>
    <div id="help" class="hidden"></div>
  </div>
</div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div id="where"><b id="whereName"></b><span id="whereSub"></span></div>
  <button id="menuBtn">Cliffs</button>
  <button id="fsHudBtn" aria-label="Full screen">⛶</button>
  <div id="spin" class="hidden"><b class="num" id="spinNum"></b><span id="spinSub"></span></div>
  <div id="alt" class="hidden"><div id="altFill"></div><div id="altLabel" class="num"></div></div>
  <div id="callout"></div>
  <div id="trail"></div>
  <div id="hint" class="hidden"></div>
  <button class="big hidden" id="diveBtn">Dive</button>
  <div id="pads" class="hidden">
    <div class="pad" id="pTuck">TUCK</div>
  </div>
</div>

<!-- Scorecard -->
<div id="score" class="hidden">
  <div class="card" role="dialog" aria-label="Dive score">
    <div class="cardTop">
      <div><div id="dName"></div><div id="dSub"></div></div>
      <div id="dd"><b class="num" id="ddNum"></b><span>difficulty</span></div>
    </div>
    <div id="judges">
      <div class="judge"><small>Judge 1</small><b class="num" id="j0"></b></div>
      <div class="judge"><small>Judge 2</small><b class="num" id="j1"></b></div>
      <div class="judge"><small>Judge 3</small><b class="num" id="j2"></b></div>
      <div class="judge total"><small>Score</small><b class="num" id="jt"></b></div>
    </div>
    <div id="verdict"></div>
    <div class="cardBtns">
      <button class="big" id="againBtn">Dive again</button>
      <button class="ghost" id="nextBtn">Next cliff</button>
      <button class="ghost" id="cliffsBtn">Cliffs</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const isTouch = "ontouchstart" in window || navigator.maxTouchPoints > 0;
  const $ = id => document.getElementById(id);

  // =====================================================================
  // Game constants
  // =====================================================================
  const U = 2.8;                       // world units per meter (diver is ~1.8 m tall)
  const G = 9.8 * U;                   // gravity
  const CLIFFS = [
    { name: "Rock Ledge", m: 10, x: -18 },
    { name: "Lighthouse Point", m: 15, x: -9 },
    { name: "Eagle's Perch", m: 20, x: 0 },
    { name: "Pro Platform", m: 27, x: 9 },
    { name: "Legend's Leap", m: 35, x: 18 },
  ];
  const UNLOCK = 40;                   // score needed on your highest cliff to open the next one
  const COM = 2.7;                     // diver's center above the feet

  // =====================================================================
  // Save data
  // =====================================================================
  const save = { unlocked: 1, best: CLIFFS.map(() => 0), dives: 0, sound: true, cliff: 0 };
  function persist() {
    try { const p = window.storage.set("cliffdive-save", JSON.stringify(save), false); if (p && p.catch) p.catch(() => {}); } catch (e) {}
  }
  async function restore() {
    try {
      const r = await window.storage.get("cliffdive-save", false);
      if (r && r.value) {
        const d = JSON.parse(r.value);
        Object.assign(save, d);
        if (!Array.isArray(save.best) || save.best.length !== CLIFFS.length) save.best = CLIFFS.map((_, i) => (d.best && d.best[i]) || 0);
        save.unlocked = Math.max(1, Math.min(CLIFFS.length, save.unlocked | 0));
        save.cliff = Math.max(0, Math.min(save.unlocked - 1, save.cliff | 0));
      }
    } catch (e) {}
    renderMenu();
  }

  // =====================================================================
  // Three.js
  // =====================================================================
  const canvas = $("c");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.75));
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xbfe6f5, 320, 1500);
  const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 3000);
  scene.add(new THREE.HemisphereLight(0xdff4ff, 0x4a6a6a, 0.85));
  const sun = new THREE.DirectionalLight(0xfff1d6, 1.0);
  sun.position.set(-160, 260, 220);
  scene.add(sun);
  function resize() {
    renderer.setSize(innerWidth, innerHeight, false);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
  }
  addEventListener("resize", resize); resize();

  const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: o.rough ?? 0.8, metalness: o.metal ?? 0.02, flatShading: !!o.flat, vertexColors: !!o.vc });
  const basic = (color, o = {}) => new THREE.MeshBasicMaterial({ color, fog: o.fog ?? true });
  const add = (geo, mat, x = 0, y = 0, z = 0, parent = scene) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); parent.add(m); return m; };

  // ---------- Sky ----------
  {
    const geo = new THREE.SphereGeometry(2000, 32, 16);
    const col = [], top = new THREE.Color(0x2f86d1), hor = new THREE.Color(0xcdeefa), low = new THREE.Color(0x8fd0e6), c = new THREE.Color();
    const p = geo.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const y = p.getY(i) / 2000;
      if (y > 0) c.copy(hor).lerp(top, Math.pow(y, 0.55)); else c.copy(hor).lerp(low, Math.min(1, -y * 4));
      col.push(c.r, c.g, c.b);
    }
    geo.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
    scene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false })));
    const sunDisc = add(new THREE.SphereGeometry(55, 24, 12), basic(0xfff4cf, { fog: false }));
    sunDisc.position.copy(sun.position).normalize().multiplyScalar(1700);
  }

  // ---------- Water (waves move on the graphics card) ----------
  const waterU = { uTime: { value: 0 } };
  const WAVE_GLSL = `
    uniform float uTime;
    float waveH(vec2 p) {
      return 0.35 * sin(p.x * 0.08 + uTime * 1.1) + 0.25 * sin(p.y * 0.11 - uTime * 1.4)
           + 0.15 * sin((p.x + p.y) * 0.21 + uTime * 2.0) + 0.06 * sin(p.x * 0.6 - p.y * 0.5 + uTime * 3.1);
    }`;
  const waveH = (x, z, t) => 0.35 * Math.sin(x * 0.08 + t * 1.1) + 0.25 * Math.sin(z * 0.11 - t * 1.4)
    + 0.15 * Math.sin((x + z) * 0.21 + t * 2.0) + 0.06 * Math.sin(x * 0.6 - z * 0.5 + t * 3.1);
  {
    const geo = new THREE.PlaneGeometry(4000, 4000, 220, 220); geo.rotateX(-Math.PI / 2);
    const mat = new THREE.MeshStandardMaterial({ color: 0x1593ad, roughness: 0.18, metalness: 0.12 });
    mat.onBeforeCompile = sh => {
      sh.uniforms.uTime = waterU.uTime;
      sh.vertexShader = WAVE_GLSL + "\n" + sh.vertexShader
        .replace("#include <beginnormal_vertex>", `
          float e = 0.6; vec2 wp = position.xz;
          float h0 = waveH(wp), hx = waveH(wp + vec2(e, 0.0)), hz = waveH(wp + vec2(0.0, e));
          vec3 objectNormal = normalize(vec3(h0 - hx, e, h0 - hz));
          #ifdef USE_TANGENT
            vec3 objectTangent = vec3(tangent.xyz);
          #endif`)
        .replace("#include <begin_vertex>", "vec3 transformed = vec3(position.x, position.y + waveH(position.xz), position.z);");
    };
    scene.add(new THREE.Mesh(geo, mat));
    // Deeper color far out, lighter shallows near the cliff
    const shallow = add(new THREE.CircleGeometry(70, 48), new THREE.MeshBasicMaterial({ color: 0x3fd0d6, transparent: true, opacity: 0.22, depthWrite: false }), 0, 0.45, -10);
    shallow.rotation.x = -Math.PI / 2;
  }

  // ---------- Rock shapes (faceted, low-poly) ----------
  function noise3(x, y, z, s) {
    return Math.sin(x * 0.15 + s) * Math.cos(z * 0.13 + s * 1.7) * 0.5 + Math.sin(y * 0.21 + x * 0.07 + s * 2.3) * 0.35
      + Math.sin(z * 0.37 - y * 0.19 + s) * 0.25 + Math.sin(x * 0.9 + y * 0.8 + z * 0.7 + s) * 0.12;
  }
  function rock(rTop, rBot, h, x, yBottom, z, seed, o = {}) {
    let geo = new THREE.CylinderGeometry(rTop, rBot, h, o.seg || 22, o.hseg || 14);
    const p = geo.attributes.position, v = new THREE.Vector3();
    for (let i = 0; i < p.count; i++) {
      v.fromBufferAttribute(p, i);
      const wy = v.y + h / 2 + yBottom;
      const n = noise3(v.x + x, wy, v.z + z, seed);
      const len = Math.hypot(v.x, v.z);
      if (len > 0.01) { const k = 1 + (n * (o.rough || 3.2)) / len; v.x *= k; v.z *= k; }
      if (v.y > h / 2 - 0.01) v.y += n * 2.5;
      p.setXYZ(i, v.x, v.y, v.z);
    }
    geo = geo.toNonIndexed(); geo.computeVertexNormals();
    const pos = geo.attributes.position, nor = geo.attributes.normal, col = [];
    const cRock = new THREE.Color(o.rock || 0x9a8672), cDark = new THREE.Color(0x4a443e), cGrass = new THREE.Color(o.grass || 0x5f9e4a), cBand = new THREE.Color(o.band || 0xb3a088), c = new THREE.Color();
    for (let i = 0; i < pos.count; i += 3) {
      const y = (pos.getY(i) + pos.getY(i + 1) + pos.getY(i + 2)) / 3 + h / 2 + yBottom, ny = nor.getY(i);
      if (ny > 0.62 && y > 3) c.copy(cGrass).offsetHSL(0, 0, (Math.sin(i) * 0.04));
      else if (y < 2.5) c.copy(cDark);
      else c.copy(Math.sin(y * 0.35) > 0.55 ? cBand : cRock).offsetHSL(0, 0, Math.sin(i * 1.7) * 0.035);
      for (let k = 0; k < 3; k++) col.push(c.r, c.g, c.b);
    }
    geo.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
    const m = add(geo, std(0xffffff, { vc: true, flat: true, rough: 0.95 }), x, yBottom + h / 2, z);
    return m;
  }

  // ---------- The main cliff ----------
  const CLIFF = { x: 0, z: -34, rTop: 27, rBot: 38, yBot: -10, h: 122 };
  rock(CLIFF.rTop, CLIFF.rBot, CLIFF.h, CLIFF.x, CLIFF.yBot, CLIFF.z, 1.3, { rough: 3.4, seg: 26, hseg: 18 });
  const radiusAt = y => CLIFF.rBot + (CLIFF.rTop - CLIFF.rBot) * Math.min(1, Math.max(0, (y - CLIFF.yBot) / CLIFF.h));
  const frontAt = (x, y) => { const r = radiusAt(y); return CLIFF.z + Math.sqrt(Math.max(0, r * r - x * x)); };

  // ---------- Platforms ----------
  function heightLabel(text) {

    const cards = [...document.querySelectorAll(".judge")];
    cards.forEach(c => c.classList.remove("in"));
    cards.forEach((c, i) => setTimeout(() => { c.classList.add("in"); tone("sine", i === 3 ? 660 : 880, i === 3 ? 990 : 880, 0.18, 0.12); }, 250 + i * 420));
    setTimeout(() => cheer(r.total >= 60 ? 2 : r.total >= 30 ? 1 : 0), 1700);
    show(["hud", "score"]); setState("score");
    $("againBtn").focus({ preventScroll: true });
  }

  // =====================================================================
  // Menu
  // =====================================================================
  function renderMenu() {
    const ladder = $("ladder"); ladder.innerHTML = "";
    for (let i = CLIFFS.length - 1; i >= 0; i--) {
      const c = CLIFFS[i], open = i < save.unlocked;
      const b = document.createElement("button");
      b.className = "rung"; b.disabled = !open;
      b.setAttribute("aria-pressed", save.cliff === i);
      b.innerHTML = `<span class="h num">${c.m}<small> m</small></span><span class="n">${c.name}</span>` +
        `<span class="b num">${open ? (save.best[i] ? "Best " + save.best[i].toFixed(1) : "New") : "Score " + UNLOCK + " on " + CLIFFS[i - 1].name}</span>`;
      b.addEventListener("click", () => { save.cliff = i; persist(); renderMenu(); });
      ladder.append(b);
    }
    $("soundBtn").textContent = "Sound: " + (save.sound ? "on" : "off");
  }
  $("help").innerHTML = isTouch
    ? `<p><b>Swipe up</b> to flip forward, <b>swipe down</b> to flip backward. Bigger, faster swipes spin harder.</p>
       <p><b>Swipe left or right</b> to twist like a corkscrew.</p>
       <p><b>Hold TUCK</b> to curl up and spin much faster. Let go near upright and you'll straighten out for a clean entry.</p>`
    : `<p><b>Space</b> run off the edge. <b>W / S</b> or <b>↑ / ↓</b> flip forward or back.</p><p><b>A / D</b> or <b>← / →</b> twist. <b>Shift</b> (either one) tuck to spin faster.</p>
       <p>Land straight up and down, feet or head first, and let go of Shift before the water.</p><p><b>R</b> dive again. <b>Esc</b> back to the cliffs. <b>F</b> full screen.</p>`;
  $("helpBtn").addEventListener("click", () => $("help").classList.toggle("hidden"));
  $("soundBtn").addEventListener("click", () => { save.sound = !save.sound; persist(); renderMenu(); });
  $("goBtn").addEventListener("click", () => { initAudio(); goToCliff(save.cliff); });
  $("menuBtn").addEventListener("click", toMenu);
  $("cliffsBtn").addEventListener("click", toMenu);
  $("againBtn").addEventListener("click", () => goToCliff(cliffIdx));
  $("nextBtn").addEventListener("click", () => goToCliff(Math.min(cliffIdx + 1, save.unlocked - 1)));
  $("diveBtn").addEventListener("click", startRun);
  // ---------- Full screen ----------
  const root = document.documentElement;
  const isFull = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  let toastTimer;
  function toast(text, secs = 5) {
    const t = $("toast"); t.textContent = text; t.style.opacity = 1;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.opacity = 0, secs * 1000);
  }
  function fsLabels() {
    const on = isFull();
    $("fsMenuBtn").textContent = on ? "⛶ Exit full screen" : "⛶ Full screen";
    $("fsHudBtn").setAttribute("aria-label", on ? "Exit full screen" : "Full screen");
    $("fsHudBtn").textContent = on ? "🗗" : "⛶";
  }
  async function toggleFull() {
    try {
      if (isFull()) {
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        await exit.call(document);
      } else {
        const blocked = document.fullscreenEnabled === false && !document.webkitFullscreenEnabled;
        if (root.requestFullscreen && !blocked) await root.requestFullscreen({ navigationUI: "hide" });
        else if (root.webkitRequestFullscreen && !blocked) root.webkitRequestFullscreen();
        else throw new Error("not allowed");
        setTimeout(() => { if (!isFull()) toast("This window didn't allow full screen. Try opening the game in its own browser tab."); }, 600);
      }
    } catch (e) {
      toast("This window didn't allow full screen. Try opening the game in its own browser tab.");
    }
    try { canvas.focus({ preventScroll: true }); } catch (e) {}
  }
  $("fsMenuBtn").addEventListener("click", toggleFull);
  $("fsHudBtn").addEventListener("click", toggleFull);
  document.addEventListener("fullscreenchange", () => { fsLabels(); resize(); });
  document.addEventListener("webkitfullscreenchange", () => { fsLabels(); resize(); });

  function toMenu() { state = "menu"; diver.root.visible = true; renderMenu(); show(["menu"]); setState("menu"); }

  // =====================================================================
  // Input: keyboard and touch work together
  // =====================================================================
  canvas.tabIndex = 0;
  addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    if (e.code === "ShiftLeft" || e.code === "ShiftRight" || k === "shift") { fireCodes.add(e.code || "Shift"); if (state === "air") everTucked = true; return; }
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k) && state !== "menu") e.preventDefault();
    keys[k] = true;
    if (e.repeat) return;
    if (k === "f") { toggleFull(); return; }
    if (state === "ready" && (k === " " || k === "enter")) startRun();
    else if (state === "score" && (k === " " || k === "enter" || k === "r")) { e.preventDefault(); goToCliff(cliffIdx); }
    else if (k === "r" && (state === "ready" || state === "air" || state === "under")) goToCliff(cliffIdx);
    else if (k === "escape" && state !== "menu") toMenu();
  });
  addEventListener("keyup", e => {
    const k = e.key.toLowerCase();
    if (e.code === "ShiftLeft" || e.code === "ShiftRight" || k === "shift") { fireCodes.delete(e.code || "Shift"); return; }
    keys[k] = false;
  });
  addEventListener("blur", () => { for (const k in keys) keys[k] = false; fireCodes.clear(); for (const k in pad) pad[k] = false; });
  const holdPad = (id, key) => {
    const el = $(id);
    const on = e => { e.preventDefault(); pad[key] = true; el.classList.add("on"); if (key === "tuck" && state === "air") everTucked = true; };
    const off = () => { pad[key] = false; el.classList.remove("on"); };
    el.addEventListener("pointerdown", on);
    for (const ev of ["pointerup", "pointercancel", "pointerleave"]) el.addEventListener(ev, off);
  };
  holdPad("pTuck", "tuck");

  // Swipe anywhere on the screen: up/down to flip, left/right to twist. Faster, longer swipes spin harder.
  let swipeId = null, sx = 0, sy = 0, lastSwipeFlip = -9;
  const SWIPE_FLIP = 0.022, SWIPE_TWIST = 0.035;
  canvas.addEventListener("pointerdown", e => {
    try { canvas.focus({ preventScroll: true }); } catch (err) {}
    if (swipeId !== null) return;
    swipeId = e.pointerId; sx = e.clientX; sy = e.clientY;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    const tr = $("trail"); tr.style.left = sx + "px"; tr.style.top = sy + "px"; tr.style.opacity = state === "air" ? 1 : 0;
  });
  canvas.addEventListener("pointermove", e => {
    if (e.pointerId !== swipeId) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    sx = e.clientX; sy = e.clientY;
    const tr = $("trail"); tr.style.left = sx + "px"; tr.style.top = sy + "px";
    if (state !== "air") return;
    if (Math.abs(dy) > 0.5) { Lp = Math.max(-8, Math.min(8, Lp - dy * SWIPE_FLIP)); lastSwipeFlip = now; }
    if (Math.abs(dx) > 0.5) Lt = Math.max(-12, Math.min(12, Lt - dx * SWIPE_TWIST));
  });
  const endSwipe = e => { if (e.pointerId === swipeId) { swipeId = null; $("trail").style.opacity = 0; } };
  canvas.addEventListener("pointerup", endSwipe);
  canvas.addEventListener("pointercancel", endSwipe);

  // =====================================================================
  // Main loop
  // =====================================================================
  let last = performance.now(), camT = 0;
  const camPos = new THREE.Vector3(140, 70, 160), camLook = new THREE.Vector3(0, 40, 0), _tp = new THREE.Vector3(), _tl = new THREE.Vector3();

  function updateDiver(dt) {
    const p = platforms[cliffIdx];
    if (state === "ready") {
      setPose(POSE.stand, dt);
      diver.root.position.copy(pos); diver.root.quaternion.identity();
    } else if (state === "run") {
      const sp = Math.min(10.5, 3 + stateT * 9);
      pos.z += sp * dt;
      const sw = Math.sin(stateT * 14) * 0.9;
      setPose({ aLx: sw, aLz: -0.1, aRx: -sw, aRz: 0.1, lLx: -sw, lRx: sw, kLx: 0.5 + Math.max(0, sw) * 0.6, kRx: 0.5 + Math.max(0, -sw) * 0.6 }, dt);
      diver.root.position.copy(pos); diver.root.position.y += Math.abs(Math.sin(stateT * 14)) * 0.18;
      if (pos.z >= p.edge) takeOff();
    } else if (state === "air") {
      vel.y -= G * dt;
      pos.addScaledVector(vel, dt);
      const tk = tucked();
      if (tk) everTucked = true;
      const flipIn = (keys.w || keys.arrowup || pad.fwd ? 1 : 0) - (keys.s || keys.arrowdown || pad.back ? 1 : 0);
      const twistIn = (keys.a || keys.arrowleft || pad.twL ? 1 : 0) - (keys.d || keys.arrowright || pad.twR ? 1 : 0);
      Lp = Math.max(-8, Math.min(8, Lp + flipIn * 14 * dt));
      if (!flipIn && now - lastSwipeFlip > 0.3) {
        // Opening up near vertical: the diver lines up for a clean entry by themselves
        _up.set(0, 1, 0).applyQuaternion(q); _xw.set(1, 0, 0).applyQuaternion(q);
        const target = _up.y >= 0 ? 1 : -1;
        _cr.set(0, target, 0); _cr.crossVectors(_up, _cr);
        const err = Math.atan2(_cr.dot(_xw), _up.y * target);
        if (!tk && stateT > 0.3 && Math.abs(err) < 1.05) { Lp += err * 9 * dt; Lp *= 1 - 3 * dt; }
        else Lp *= 1 - 0.25 * dt;
      }
      Lt = Math.max(-12, Math.min(12, Lt + twistIn * 22 * dt)); if (!twistIn) Lt *= 1 - 0.6 * dt;
      pitchRate = Lp / (tk ? 1 : 2.6);
      twistRate = Lt / (tk ? 2.5 : 1);
      q.multiply(_qa.setFromAxisAngle(AX, pitchRate * dt)).multiply(_qa.setFromAxisAngle(AY, twistRate * dt)).normalize();
      flipAngle += pitchRate * dt; twistAngle += twistRate * dt;
      _up.set(0, 1, 0).applyQuaternion(q);
      setPose(tk ? POSE.tuck : _up.y < -0.25 ? POSE.headfirst : stateT < 0.25 ? POSE.spread : POSE.straight, dt);
      diver.root.position.copy(pos); diver.root.quaternion.copy(q);
      // HUD while falling
      const fh = Math.floor(Math.abs(flipAngle) / Math.PI + 0.15), th = Math.floor(Math.abs(twistAngle) / Math.PI + 0.15);
      $("spinNum").textContent = fh || th ? (fh ? half(fh) + " flip" + (fh > 2 ? "s" : "") : "") + (fh && th ? " · " : "") + (th ? half(th) + " twist" + (th > 2 ? "s" : "") : "") : "Free fall";
      $("spinSub").textContent = Math.round(vel.length() / U * 3.6) + " km/h";
      const frac = Math.max(0, (pos.y - COM) / p.H);
      $("altFill").style.height = (frac * 100) + "%";
      $("altLabel").style.bottom = (frac * 100) + "%";
      $("altLabel").textContent = Math.max(0, (pos.y - COM) / U).toFixed(0) + " m";
      const tLeft = (vel.y + Math.sqrt(Math.max(0, vel.y * vel.y + 2 * G * pos.y))) / G;
      if (tLeft < 0.55 && (tk || Math.abs(pitchRate) > 2.2)) hint(tk ? (isTouch ? "Let go of TUCK!" : "Let go of Shift!") : "Stop spinning!");
      else if (tLeft < 0.55) hint("");
      else if (stateT < 1.4) hint(isTouch ? "Swipe ↑ ↓ to flip, ← → to twist, hold TUCK to spin faster" : "W/S flip · A/D twist · Shift tuck (or swipe with the mouse)");
      else hint("");
      if (wind) { wind.g.gain.setTargetAtTime(save.sound ? Math.min(0.22, vel.length() / 320) : 0, actx.currentTime, 0.1); wind.f.frequency.setTargetAtTime(300 + vel.length() * 10, actx.currentTime, 0.1); }
      if (pos.y <= 0.4) enterWater();
    } else if (state === "under") {
      vel.multiplyScalar(Math.pow(0.02, dt)); pos.addScaledVector(vel, dt);
      diver.root.position.copy(pos); diver.root.quaternion.copy(q);
      if (stateT > 0.35) diver.root.visible = false;
      if (stateT > 1.6) showScore();
    }
    const showShadow = diver.root.visible && (state === "ready" || state === "run");
    diver.shadow.visible = showShadow;
    if (showShadow) diver.shadow.position.set(pos.x, p.H + 0.03, pos.z);
  }

  function updateCamera(dt) {
    camT += dt;
    const p = platforms[cliffIdx];
    if (state === "menu") {
      const a = performance.now() / 1000 * 0.05;
      _tp.set(Math.sin(a) * 190 + 30, 75, Math.cos(a) * 150 + 90); _tl.set(0, 42, -10);
    } else if (state === "ready" || state === "run") {
      _tp.set(p.x + 9, p.H + 7.5, p.start - 10); _tl.set(p.x - 1, p.H - 14, p.edge + 22);
    } else if (state === "air") {
      _tp.set(pos.x + 26, Math.max(4, pos.y + 4), pos.z - 6); _tl.set(pos.x, pos.y - 3, pos.z + 5);
    } else {
      _tp.set(entry.x + 24, 6, entry.z - 10); _tl.set(entry.x, 3, entry.z);
    }
    const k = state === "menu" ? 1 : Math.min(1, dt * (state === "air" ? 5 : camT < 0.05 ? 60 : 3));
    camPos.lerp(_tp, k); camLook.lerp(_tl, k);
    camera.position.copy(camPos); camera.lookAt(camLook);
  }

  function frame(t) {
    const dt = Math.min(0.05, (t - last) / 1000); last = t;
    now += dt; stateT += dt;
    waterU.uTime.value = now;
    updateDiver(dt);
    updateCamera(dt);
    updateSplash(dt);
    // Scenery motion
    boat.position.y = waveH(boat.position.x, boat.position.z, now) + 0.1;
    boat.rotation.z = Math.sin(now * 0.9) * 0.04; boat.rotation.x = Math.sin(now * 0.7) * 0.03;
    for (const b of buoys) b.position.set(b.userData.x, waveH(b.userData.x, b.userData.z, now) + 0.3, b.userData.z);
    for (const g of gulls) {
      const a = now * g.sp + g.ph;
      g.g.position.set(Math.cos(a) * g.r, g.h + Math.sin(a * 2) * 4, Math.sin(a) * g.r - 10);
      g.g.rotation.y = -a; g.g.rotation.z = 0.25;
      const flap = Math.sin(now * 7 + g.ph) * 0.5;
      g.wl.rotation.z = flap; g.wr.rotation.z = -flap;
    }
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  // =====================================================================
  // Boot
  // =====================================================================
  renderMenu();
  restore();
  goToCliff(save.cliff); toMenu();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
